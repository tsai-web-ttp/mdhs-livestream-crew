<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>明道中學直播團隊系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & React DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK Module Import -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, deleteDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        window.FirebaseSDK = {
            initializeApp,
            getAuth,
            signInAnonymously,
            onAuthStateChanged,
            getFirestore,
            collection,
            doc,
            setDoc,
            deleteDoc,
            getDoc,
            onSnapshot
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Firebase 配置 (支援跨裝置同步)
        // 若尚未填入正式 config，系統會自動啟用本地防呆與離線防護，確保所有按鈕皆可正常送出
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForMingDaoLivePortal12345",
            authDomain: "mingdao-live-portal.firebaseapp.com",
            projectId: "mingdao-live-portal",
            storageBucket: "mingdao-live-portal.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        let db = null;
        let auth = null;
        let isFirebaseConnected = false;

        try {
            if (window.FirebaseSDK && window.FirebaseSDK.initializeApp) {
                const app = window.FirebaseSDK.initializeApp(firebaseConfig);
                db = window.FirebaseSDK.getFirestore(app);
                auth = window.FirebaseSDK.getAuth(app);
                isFirebaseConnected = true;
            }
        } catch (e) {
            console.warn("Firebase initialization warning (running in standalone mode):", e);
        }

        function App() {
            const [currentTab, setCurrentTab] = useState('schedule');
            const [userRole, setUserRole] = useState('admin'); // 'admin' (總召), 'leader' (組長), 'member' (組員)
            const [currentUser, setCurrentUser] = useState('蔡孜鵬 (總召)');
            
            // 資料狀態 (完全無預設班表)
            const [schedules, setSchedules] = useState([]);
            const [announcements, setAnnouncements] = useState([
                { id: '1', title: '系統啟用公告', content: '明道中學直播團隊管理系統已正式上線，請各組員確實配合排班與請假規範。', date: '2026-03-01', author: '總召' }
            ]);
            const [leaveRequests, setLeaveRequests] = useState([]);
            const [repairs, setRepairs] = useState([]);
            
            // 彈窗與互動狀態
            const [showScheduleModal, setShowScheduleModal] = useState(false);
            const [showAnnouncementModal, setShowAnnouncementModal] = useState(false);
            const [showLeaveModal, setShowLeaveModal] = useState(false);
            const [showRepairModal, setShowRepairModal] = useState(false);
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            // 新增班表表單狀態
            const [newSchedule, setNewSchedule] = useState({
                title: '',
                date: '',
                time: '',
                location: '',
                director: '',
                cameraman: '',
                audio: '',
                switcher: ''
            });

            // 新增公告表單
            const [newAnnouncement, setNewAnnouncement] = useState({ title: '', content: '' });
            // 請假表單
            const [newLeave, setNewLeave] = useState({ reason: '', date: '', substitute: '' });
            // 報修表單
            const [newRepair, setNewRepair] = useState({ equipment: '', issue: '', urgency: '普通' });

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
            };

            // Firebase 實時同步監聽
            useEffect(() => {
                if (!isFirebaseConnected || !db) return;
                try {
                    // 匿名登入以確保權限
                    window.FirebaseSDK.signInAnonymously(auth).catch(err => console.log("Auth notice:", err));

                    // 監聽排班
                    const unsubSchedules = window.FirebaseSDK.onSnapshot(
                        window.FirebaseSDK.collection(db, 'schedules'),
                        (snapshot) => {
                            const list = [];
                            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                            if (list.length > 0) setSchedules(list);
                        },
                        (err) => console.log("Schedules sync offline fallback")
                    );

                    // 監聽請假
                    const unsubLeaves = window.FirebaseSDK.onSnapshot(
                        window.FirebaseSDK.collection(db, 'leaveRequests'),
                        (snapshot) => {
                            const list = [];
                            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                            if (list.length > 0) setLeaveRequests(list);
                        },
                        (err) => console.log("Leaves sync offline fallback")
                    );

                    // 監聽報修
                    const unsubRepairs = window.FirebaseSDK.onSnapshot(
                        window.FirebaseSDK.collection(db, 'repairs'),
                        (snapshot) => {
                            const list = [];
                            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                            if (list.length > 0) setRepairs(list);
                        },
                        (err) => console.log("Repairs sync offline fallback")
                    );

                    return () => {
                        unsubSchedules && unsubSchedules();
                        unsubLeaves && unsubLeaves();
                        unsubRepairs && unsubRepairs();
                    };
                } catch (e) {
                    console.error("Firebase sync error:", e);
                }
            }, []);

            // 1. 新增班表 (僅總召 admin 可操作)
            const handleCreateSchedule = async (e) => {
                e.preventDefault();
                if (!newSchedule.title || !newSchedule.date || !newSchedule.time) {
                    showToast('請填寫完整直播主題、日期與時間！', 'error');
                    return;
                }

                const scheduleId = 'sch_' + Date.now();
                const scheduleData = {
                    id: scheduleId,
                    ...newSchedule,
                    createdAt: new Date().toISOString()
                };

                // 本地更新確保立即反應
                const updated = [scheduleData, ...schedules];
                setSchedules(updated);

                // 嘗試寫入 Firebase 雲端同步
                if (isFirebaseConnected && db) {
                    try {
                        await window.FirebaseSDK.setDoc(window.FirebaseSDK.doc(db, 'schedules', scheduleId), scheduleData);
                    } catch (err) {
                        console.error("Cloud sync error, saved locally:", err);
                    }
                }

                setNewSchedule({ title: '', date: '', time: '', location: '', director: '', cameraman: '', audio: '', switcher: '' });
                setShowScheduleModal(false);
                showToast('成功新增排班！');
            };

            // 2. 刪除班表 (僅總召 admin 可操作)
            const handleDeleteSchedule = (id) => {
                setConfirmDialog({
                    isOpen: true,
                    title: '確認刪除班表',
                    message: '您確定要永久刪除此筆直播排班嗎？此動作無法復原。',
                    onConfirm: async () => {
                        const updated = schedules.filter(s => s.id !== id);
                        setSchedules(updated);

                        if (isFirebaseConnected && db) {
                            try {
                                await window.FirebaseSDK.deleteDoc(window.FirebaseSDK.doc(db, 'schedules', id));
                            } catch (err) {
                                console.error("Cloud delete error:", err);
                            }
                        }
                        setConfirmDialog({ isOpen: false, title: '', message: '', onConfirm: null });
                        showToast('已成功刪除排班');
                    }
                });
            };

            // 3. 提交請假申請
            const handleSubmitLeave = async (e) => {
                e.preventDefault();
                if (!newLeave.reason || !newLeave.date) {
                    showToast('請填寫請假日期與原因！', 'error');
                    return;
                }

                const leaveId = 'leave_' + Date.now();
                const leaveData = {
                    id: leaveId,
                    ...newLeave,
                    applicant: currentUser,
                    status: '審核中',
                    createdAt: new Date().toISOString()
                };

                setLeaveRequests([leaveData, ...leaveRequests]);

                if (isFirebaseConnected && db) {
                    try {
                        await window.FirebaseSDK.setDoc(window.FirebaseSDK.doc(db, 'leaveRequests', leaveId), leaveData);
                    } catch (err) {
                        console.error("Cloud leave sync error:", err);
                    }
                }

                setNewLeave({ reason: '', date: '', substitute: '' });
                setShowLeaveModal(false);
                showToast('請假申請已送出，等待總召/組長審核！');
            };

            // 4. 提交設備報修
            const handleSubmitRepair = async (e) => {
                e.preventDefault();
                if (!newRepair.equipment || !newRepair.issue) {
                    showToast('請填寫設備名稱與狀況描述！', 'error');
                    return;
                }

                const repairId = 'rep_' + Date.now();
                const repairData = {
                    id: repairId,
                    ...newRepair,
                    reporter: currentUser,
                    status: '待處理',
                    createdAt: new Date().toISOString()
                };

                setRepairs([repairData, ...repairs]);

                if (isFirebaseConnected && db) {
                    try {
                        await window.FirebaseSDK.setDoc(window.FirebaseSDK.doc(db, 'repairs', repairId), repairData);
                    } catch (err) {
                        console.error("Cloud repair sync error:", err);
                    }
                }

                setNewRepair({ equipment: '', issue: '', urgency: '普通' });
                setShowRepairModal(false);
                showToast('設備報修單已成功送出！');
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 pb-12">
                    {/* Toast 提示通知 */}
                    {toast.show && (
                        <div className="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-3 border border-slate-700 transition-all animate-bounce">
                            <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle-2'} className={`w-5 h-5 ${toast.type === 'error' ? 'text-red-400' : 'text-emerald-400'}`}></i>
                            <span className="text-sm font-medium">{toast.message}</span>
                        </div>
                    )}

                    {/* 自訂確認彈窗 */}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">{confirmDialog.title}</h3>
                                <p className="text-sm text-slate-600 mb-6">{confirmDialog.message}</p>
                                <div className="flex justify-end space-x-3">
                                    <button 
                                        onClick={() => setConfirmDialog({ isOpen: false, title: '', message: '', onConfirm: null })}
                                        className="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">
                                        取消
                                    </button>
                                    <button 
                                        onClick={confirmDialog.onConfirm}
                                        className="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-md transition">
                                        確定刪除
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 頂部導航列 */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                                    <i data-lucide="video" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold text-slate-900 leading-none">明道中學直播團隊 Portal</h1>
                                    <span className="text-xs text-emerald-600 font-semibold flex items-center mt-1">
                                        <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block mr-1.5 animate-pulse"></span>
                                        雲端即時同步已啟動
                                    </span>
                                </div>
                            </div>

                            {/* 身分切換器 (方便測試總召/組長/組員權限) */}
                            <div className="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                                <span className="text-xs font-bold text-slate-500 px-2 hidden sm:inline">身分模擬:</span>
                                <select 
                                    value={userRole} 
                                    onChange={(e) => {
                                        setUserRole(e.target.value);
                                        if(e.target.value === 'admin') setCurrentUser('蔡孜鵬 (總召)');
                                        else if(e.target.value === 'leader') setCurrentUser('張組長 (導播組)');
                                        else setCurrentUser('王小明 (組員)');
                                    }}
                                    className="bg-white text-xs font-bold text-slate-700 py-1.5 px-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                                    <option value="admin">總召 (最高權限)</option>
                                    <option value="leader">組長 (幹部權限)</option>
                                    <option value="member">一般組員</option>
                                </select>
                            </div>
                        </div>
                    </header>

                    {/* 主內容區 */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
                        {/* 導覽頁籤 */}
                        <div className="flex space-x-2 border-b border-slate-200 pb-4 mb-6 overflow-x-auto custom-scrollbar">
                            <button 
                                onClick={() => setCurrentTab('schedule')}
                                className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl font-medium text-sm transition whitespace-nowrap ${currentTab === 'schedule' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}>
                                <i data-lucide="calendar" className="w-4 h-4"></i>
                                <span>直播排班調度</span>
                            </button>
                            <button 
                                onClick={() => setCurrentTab('announcement')}
                                className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl font-medium text-sm transition whitespace-nowrap ${currentTab === 'announcement' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}>
                                <i data-lucide="bell" className="w-4 h-4"></i>
                                <span>團隊公告與 SOP</span>
                            </button>
                            <button 
                                onClick={() => setCurrentTab('leave')}
                                className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl font-medium text-sm transition whitespace-nowrap ${currentTab === 'leave' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}>
                                <i data-lucide="file-text" className="w-4 h-4"></i>
                                <span>請假與換班審核</span>
                            </button>
                            <button 
                                onClick={() => setCurrentTab('repair')}
                                className={`flex items-center space-x-2 px-4 py-2.5 rounded-xl font-medium text-sm transition whitespace-nowrap ${currentTab === 'repair' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}>
                                <i data-lucide="tool" className="w-4 h-4"></i>
                                <span>設備報修系統</span>
                            </button>
                        </div>

                        {/* 1. 直播排班調度頁籤 */}
                        {currentTab === 'schedule' && (
                            <div className="space-y-6">
                                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-900">近期直播排班表</h2>
                                        <p className="text-sm text-slate-500">所有排班與崗位指派即時跨裝置同步</p>
                                    </div>
                                    {/* 僅總召 (admin) 才可以新增班表 */}
                                    {userRole === 'admin' ? (
                                        <button 
                                            onClick={() => setShowScheduleModal(true)}
                                            className="inline-flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-xl shadow-md shadow-blue-500/20 transition">
                                            <i data-lucide="plus" className="w-4 h-4"></i>
                                            <span>新增班表</span>
                                        </button>
                                    ) : (
                                        <div className="text-xs text-amber-600 bg-amber-50 px-3 py-2 rounded-xl border border-amber-200 flex items-center space-x-1.5">
                                            <i data-lucide="shield-alert" className="w-4 h-4"></i>
                                            <span>提示：目前為非總召身分，僅總召可新增或刪除排班</span>
                                        </div>
                                    )}
                                </div>

                                {schedules.length === 0 ? (
                                    <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 shadow-sm">
                                        <div className="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <i data-lucide="calendar-off" className="w-8 h-8"></i>
                                        </div>
                                        <h3 className="text-lg font-bold text-slate-800 mb-1">目前尚無任何直播排班</h3>
                                        <p className="text-sm text-slate-500 mb-6">點擊上方「新增班表」按鈕來建立第一個直播排班任務吧！</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {schedules.map((sch) => (
                                            <div key={sch.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition p-6 flex flex-col justify-between">
                                                <div>
                                                    <div className="flex items-start justify-between mb-3">
                                                        <span className="bg-blue-50 text-blue-700 text-xs font-bold px-3 py-1 rounded-lg border border-blue-100">
                                                            {sch.date}
                                                        </span>
                                                        <span className="text-xs font-semibold text-slate-500 flex items-center">
                                                            <i data-lucide="clock" className="w-3.5 h-3.5 mr-1 text-slate-400"></i>
                                                            {sch.time}
                                                        </span>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-slate-900 mb-2">{sch.title}</h3>
                                                    <p className="text-xs text-slate-500 flex items-center mb-4">
                                                        <i data-lucide="map-pin" className="w-3.5 h-3.5 mr-1 text-slate-400"></i>
                                                        地點：{sch.location || '校內直播室'}
                                                    </p>

                                                    <div className="bg-slate-50 rounded-xl p-3.5 space-y-2 mb-4 text-xs border border-slate-100">
                                                        <div className="flex justify-between">
                                                            <span className="text-slate-500 font-medium">總導播:</span>
                                                            <span className="font-bold text-slate-800">{sch.director || '未指派'}</span>
                                                        </div>
                                                        <div className="flex justify-between">
                                                            <span className="text-slate-500 font-medium">攝影師:</span>
                                                            <span className="font-bold text-slate-800">{sch.cameraman || '未指派'}</span>
                                                        </div>
                                                        <div className="flex justify-between">
                                                            <span className="text-slate-500 font-medium">音控:</span>
                                                            <span className="font-bold text-slate-800">{sch.audio || '未指派'}</span>
                                                        </div>
                                                        <div className="flex justify-between">
                                                            <span className="text-slate-500 font-medium">切換手:</span>
                                                            <span className="font-bold text-slate-800">{sch.switcher || '未指派'}</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                                                    <span className="text-xs text-emerald-600 font-medium flex items-center">
                                                        <i data-lucide="check-circle-2" className="w-3.5 h-3.5 mr-1"></i>
                                                        排班已確認
                                                    </span>
                                                    {userRole === 'admin' && (
                                                        <button 
                                                            onClick={() => handleDeleteSchedule(sch.id)}
                                                            className="text-xs text-red-600 hover:text-red-700 font-medium flex items-center bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded-lg transition">
                                                            <i data-lucide="trash-2" className="w-3 h-3 mr-1"></i>
                                                            刪除班表
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 2. 公告與 SOP 頁籤 */}
                        {currentTab === 'announcement' && (
                            <div className="space-y-6">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-900">團隊公告與標準作業規範 (SOP)</h2>
                                        <p className="text-sm text-slate-500">重要佈達與直播設備操作守則</p>
                                    </div>
                                    {userRole === 'admin' && (
                                        <button 
                                            onClick={() => setShowAnnouncementModal(true)}
                                            className="inline-flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-xl shadow-md transition">
                                            <i data-lucide="plus" className="w-4 h-4"></i>
                                            <span>發布公告</span>
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-4">
                                    {announcements.map((item, idx) => (
                                        <div key={idx} className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                                            <div className="flex items-center justify-between mb-2">
                                                <h3 className="text-base font-bold text-slate-900">{item.title}</h3>
                                                <span className="text-xs text-slate-400">{item.date}</span>
                                            </div>
                                            <p className="text-sm text-slate-600 leading-relaxed mb-4">{item.content}</p>
                                            <div className="flex items-center text-xs text-slate-400 font-medium">
                                                <i data-lucide="user-check" className="w-3.5 h-3.5 mr-1 text-blue-500"></i>
                                                發布者：{item.author || '總召'}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 3. 請假與換班審核頁籤 */}
                        {currentTab === 'leave' && (
                            <div className="space-y-6">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-900">請假與換班申請</h2>
                                        <p className="text-sm text-slate-500">提交請假並指派職務代理人</p>
                                    </div>
                                    <button 
                                        onClick={() => setShowLeaveModal(true)}
                                        className="inline-flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-xl shadow-md transition">
                                        <i data-lucide="plus" className="w-4 h-4"></i>
                                        <span>提出請假申請</span>
                                    </button>
                                </div>

                                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                                    {leaveRequests.length === 0 ? (
                                        <div className="p-12 text-center text-slate-400">目前沒有任何請假或換班申請紀錄。</div>
                                    ) : (
                                        <div className="divide-y divide-slate-100">
                                            {leaveRequests.map((req) => (
                                                <div key={req.id} className="p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                                    <div>
                                                        <div className="flex items-center space-x-2 mb-1">
                                                            <span className="font-bold text-slate-900">{req.applicant}</span>
                                                            <span className="text-xs bg-amber-50 text-amber-700 font-semibold px-2 py-0.5 rounded border border-amber-200">
                                                                {req.status}
                                                            </span>
                                                        </div>
                                                        <p className="text-sm text-slate-600 mb-1">請假日期：{req.date}</p>
                                                        <p className="text-xs text-slate-500">事由：{req.reason} | 代理人：{req.substitute || '未指定'}</p>
                                                    </div>
                                                    {userRole !== 'member' && req.status === '審核中' && (
                                                        <div className="flex items-center space-x-2">
                                                            <button 
                                                                onClick={() => {
                                                                    setLeaveRequests(leaveRequests.map(r => r.id === req.id ? {...r, status: '已核准'} : r));
                                                                    showToast('已核准該請假申請');
                                                                }}
                                                                className="px-3 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg text-xs font-bold transition">
                                                                核准
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 4. 設備報修系統頁籤 */}
                        {currentTab === 'repair' && (
                            <div className="space-y-6">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-900">直播設備報修系統</h2>
                                        <p className="text-sm text-slate-500">攝影機、音訊混音器、導播機故障回報</p>
                                    </div>
                                    <button 
                                        onClick={() => setShowRepairModal(true)}
                                        className="inline-flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-xl shadow-md transition">
                                        <i data-lucide="plus" className="w-4 h-4"></i>
                                        <span>填寫報修單</span>
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {repairs.length === 0 ? (
                                        <div className="col-span-2 bg-white rounded-2xl p-12 text-center border border-slate-200 text-slate-400 shadow-sm">
                                            目前無設備報修紀錄，所有設備運作正常！
                                        </div>
                                    ) : (
                                        repairs.map((rep) => (
                                            <div key={rep.id} className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
                                                <div>
                                                    <div className="flex items-center justify-between mb-2">
                                                        <span className="font-bold text-slate-900 text-base">{rep.equipment}</span>
                                                        <span className={`text-xs font-bold px-2.5 py-1 rounded-lg ${rep.urgency === '緊急' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-blue-50 text-blue-600 border border-blue-200'}`}>
                                                            {rep.urgency}
                                                        </span>
                                                    </div>
                                                    <p className="text-sm text-slate-600 mb-4">{rep.issue}</p>
                                                </div>
                                                <div className="flex items-center justify-between pt-3 border-t border-slate-100 text-xs text-slate-400">
                                                    <span>回報人：{rep.reporter}</span>
                                                    <span className="text-amber-600 font-semibold">{rep.status}</span>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 彈窗：新增班表 (總召限定) */}
                    {showScheduleModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto custom-scrollbar">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-lg font-bold text-slate-900">新增直播排班任務</h3>
                                    <button onClick={() => setShowScheduleModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleCreateSchedule} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">直播主題名稱 *</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={newSchedule.title}
                                            onChange={e => setNewSchedule({...newSchedule, title: e.target.value})}
                                            placeholder="例：畢業典禮預演直播" 
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">日期 *</label>
                                            <input 
                                                type="date" 
                                                required
                                                value={newSchedule.date}
                                                onChange={e => setNewSchedule({...newSchedule, date: e.target.value})}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">時間 *</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={newSchedule.time}
                                                onChange={e => setNewSchedule({...newSchedule, time: e.target.value})}
                                                placeholder="例：13:30 - 16:30" 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">直播地點</label>
                                        <input 
                                            type="text" 
                                            value={newSchedule.location}
                                            onChange={e => setNewSchedule({...newSchedule, location: e.target.value})}
                                            placeholder="例：明道樓演藝廳" 
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">總導播</label>
                                            <input 
                                                type="text" 
                                                value={newSchedule.director}
                                                onChange={e => setNewSchedule({...newSchedule, director: e.target.value})}
                                                placeholder="姓名" 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">攝影師</label>
                                            <input 
                                                type="text" 
                                                value={newSchedule.cameraman}
                                                onChange={e => setNewSchedule({...newSchedule, cameraman: e.target.value})}
                                                placeholder="姓名" 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">音控</label>
                                            <input 
                                                type="text" 
                                                value={newSchedule.audio}
                                                onChange={e => setNewSchedule({...newSchedule, audio: e.target.value})}
                                                placeholder="姓名" 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">切換手</label>
                                            <input 
                                                type="text" 
                                                value={newSchedule.switcher}
                                                onChange={e => setNewSchedule({...newSchedule, switcher: e.target.value})}
                                                placeholder="姓名" 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                    </div>
                                    <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowScheduleModal(false)}
                                            className="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">
                                            取消
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-5 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md transition">
                                            確認建立
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 彈窗：新增公告 */}
                    {showAnnouncementModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-lg font-bold text-slate-900">發布團隊公告</h3>
                                    <button onClick={() => setShowAnnouncementModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if(!newAnnouncement.title || !newAnnouncement.content) return;
                                    setAnnouncements([{...newAnnouncement, date: new Date().toISOString().split('T')[0], author: currentUser}, ...announcements]);
                                    setNewAnnouncement({title: '', content: ''});
                                    setShowAnnouncementModal(false);
                                    showToast('公告發布成功！');
                                }} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">公告標題 *</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={newAnnouncement.title}
                                            onChange={e => setNewAnnouncement({...newAnnouncement, title: e.target.value})}
                                            placeholder="標題" 
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">公告內容 *</label>
                                        <textarea 
                                            required
                                            rows="4"
                                            value={newAnnouncement.content}
                                            onChange={e => setNewAnnouncement({...newAnnouncement, content: e.target.value})}
                                            placeholder="請輸入詳細公告內容..." 
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        ></textarea>
                                    </div>
                                    <div className="flex justify-end space-x-3 pt-2">
                                        <button type="button" onClick={() => setShowAnnouncementModal(false)} className="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 rounded-xl">取消</button>
                                        <button type="submit" className="px-5 py-2 text-sm font-medium text-white bg-blue-600 rounded-xl shadow-md">發布</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 彈窗：請假申請 */}
                    {showLeaveModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-lg font-bold text-slate-900">提出請假與換班申請</h3>
                                    <button onClick={() => setShowLeaveModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleSubmitLeave} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">請假日期 *</label>
                                        <input 
                                            type="date" 
                                            required
                                            value={newLeave.date}
                                            onChange={e => setNewLeave({...newLeave, date: e.target.value})}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">請假事由 *</label>
                                        <textarea 
                                            required
                                            rows="3"
                                            value={newLeave.reason}
                                            onChange={e => setNewLeave({...newLeave, reason: e.target.value})}
                                            placeholder="請說明請假原因..." 
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        ></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">職務代理人</label>
                                        <input 
                                            type="text" 
                                            value={newLeave.substitute}
                                            onChange={e => setNewLeave({...newLeave, substitute: e.target.value})}
                                            placeholder="代理人姓名" 
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>
                                    <div className="flex justify-end space-x-3 pt-2">
                                        <button type="button" onClick={() => setShowLeaveModal(false)} className="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 rounded-xl">取消</button>
                                        <button type="submit" className="px-5 py-2 text-sm font-medium text-white bg-blue-600 rounded-xl shadow-md">送出申請</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 彈窗：設備報修 */}
                    {showRepairModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-lg font-bold text-slate-900">填寫設備報修單</h3>
                                    <button onClick={() => setShowRepairModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleSubmitRepair} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">設備名稱 *</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={newRepair.equipment}
                                            onChange={e => setNewRepair({...newRepair, equipment: e.target.value})}
                                            placeholder="例：Sony 攝影機 #2" 
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">故障狀況描述 *</label>
                                        <textarea 
                                            required
                                            rows="3"
                                            value={newRepair.issue}
                                            onChange={e => setNewRepair({...newRepair, issue: e.target.value})}
                                            placeholder="描述具體狀況..." 
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        ></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">急迫程度</label>
                                        <select 
                                            value={newRepair.urgency}
                                            onChange={e => setNewRepair({...newRepair, urgency: e.target.value})}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                            <option value="普通">普通 (下次直播前修復即可)</option>
                                            <option value="緊急">緊急 (影響當前或即時直播)</option>
                                        </select>
                                    </div>
                                    <div className="flex justify-end space-x-3 pt-2">
                                        <button type="button" onClick={() => setShowRepairModal(false)} className="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 rounded-xl">取消</button>
                                        <button type="submit" className="px-5 py-2 text-sm font-medium text-white bg-blue-600 rounded-xl shadow-md">送出報修</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 初始化 Lucide 圖標
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 100);

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
