<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>明道中學直播團隊系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK Module Import -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, deleteDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    window.FirebaseSDK = {
      initializeApp,
      getAuth,
      signInWithCustomToken,
      signInAnonymously,
      onAuthStateChanged,
      getFirestore,
      collection,
      doc,
      setDoc,
      deleteDoc,
      getDoc,
      onSnapshot
    };
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    button, input, select, textarea { font: inherit; }
    button { -webkit-user-select: none; user-select: none; }
    ::selection { background: rgba(99,102,241,.35); }
    .app-shell {
      background:
        radial-gradient(circle at 12% 0%, rgba(79,70,229,.13), transparent 28%),
        radial-gradient(circle at 90% 12%, rgba(14,165,233,.08), transparent 25%),
        #080d18;
    }
    .glass-panel {
      background: rgba(15,23,42,.72);
      border: 1px solid rgba(148,163,184,.12);
      box-shadow: 0 18px 50px rgba(0,0,0,.18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .soft-panel {
      background: linear-gradient(180deg, rgba(30,41,59,.82), rgba(15,23,42,.78));
      border-color: rgba(148,163,184,.14);
    }
    .interactive {
      transition: transform .18s ease, border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
    }
    .interactive:hover { transform: translateY(-1px); }
    .focus-ring:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(129,140,248,.9);
      outline-offset: 2px;
    }
    .modal-backdrop { animation: fadeIn .16s ease-out; }
    .modal-card { animation: modalIn .2s ease-out; }
    .toast-in { animation: toastIn .25s ease-out; }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.98) } to { opacity: 1; transform: translateY(0) scale(1) } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    @media (max-width: 767px) {
      .mobile-safe-bottom { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
      .touch-target { min-height: 44px; min-width: 44px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-stream-team-portal';
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : { apiKey: "demo", authDomain: "demo", projectId: "demo" };

    const INITIAL_MEMBERS = [
      { id: 'm1', name: '蔡孜鵬', password: '31V714', role: 'admin', title: '總召', dept: 'admin', avatar: '' },
      { id: 'm2', name: '洪睿頤', password: '31S441', role: 'leader', title: '導播組長', dept: 'director', avatar: '' },
      { id: 'm3', name: '蕭宥華', password: '31S442', role: 'leader', title: 'CAM2 組長', dept: 'cam2', avatar: '' },
      { id: 'm4', name: '陳盈融', password: '31S276', role: 'leader', title: '音控組長', dept: 'audio', avatar: '' },
      { id: 'm10', name: '柯昱丞', password: '31S136', role: 'member', title: '導播組員', dept: 'director', avatar: '' },
      { id: 'm5', name: '楊奕璿', password: '41S285', role: 'member', title: '導播組員', dept: 'director', avatar: '' },
      { id: 'm6', name: '陳姿聿', password: '31V621', role: 'member', title: '音控組員', dept: 'audio', avatar: '' },
      { id: 'm7', name: '胡永璋', password: '41S465', role: 'member', title: '音控組員', dept: 'audio', avatar: '' },
      { id: 'm9', name: '黃芃瑀', password: '31V583', role: 'member', title: 'CAM1 攝影', dept: 'cam1', avatar: '' },
      { id: 'm8', name: '戴士捷', password: '41V105', role: 'member', title: 'CAM2 攝影', dept: 'cam2', avatar: '' }
    ];

    const DUTY_ROLES = [
      { key: 'director', label: '導播', deptKey: 'director', icon: 'tv' },
      { key: 'audio', label: '音控', deptKey: 'audio', icon: 'sliders' },
      { key: 'cam1', label: 'CAM1 攝影', deptKey: 'cam1', icon: 'camera' },
      { key: 'cam2', label: 'CAM2 攝影', deptKey: 'cam2', icon: 'video' },
      { key: 'slides', label: '簡報/字卡', deptKey: 'slides', icon: 'file-text' }
    ];

    // 需求 1：完全不要有任何預設班表
    const INITIAL_SCHEDULES = [];

    const INITIAL_SOP = {
      director: { title: '導播 SOP', items: ['07:20 前抵達導播室，開啟總電源與 OBS', '測試畫面切換'] },
      audio: { title: '音控 SOP', items: ['07:25 開啟混音器與麥克風', '檢查電池電量'] },
      cam1: { title: 'CAM1 SOP', items: ['設置於中央平台，調整水平儀'] },
      cam2: { title: 'CAM2 SOP', items: ['設置側邊特寫角度'] },
      slides: { title: '簡報 SOP', items: ['確認今日朝會 PPT 與名單'] }
    };

    function App() {
      const [db, setDb] = useState(null);
      const [authUser, setAuthUser] = useState(null);

      const [currentUser, setCurrentUser] = useState(null);
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [members, setMembers] = useState(INITIAL_MEMBERS);
      const [schedules, setSchedules] = useState(INITIAL_SCHEDULES);
      const [repairs, setRepairs] = useState([]);
      const [swaps, setSwaps] = useState([]);
      const [announcement, setAnnouncement] = useState('📢 請全體成員於朝會前 10 分鐘完成所有設備校正！');
      const [leaderSuggestions, setLeaderSuggestions] = useState([]); 
      const [sopData, setSopData] = useState(INITIAL_SOP);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      const [isEditingSchedule, setIsEditingSchedule] = useState(false);
      const [editingScheduleData, setEditingScheduleData] = useState(null);
      const [showAllForRole, setShowAllForRole] = useState({});

      const [isSwapModalOpen, setIsSwapModalOpen] = useState(false);
      const [isRepairModalOpen, setIsRepairModalOpen] = useState(false);
      const [isSuggestionModalOpen, setIsSuggestionModalOpen] = useState(false);

      const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
      const [editingMemberData, setEditingMemberData] = useState(null);
      const [isPersonalSettings, setIsPersonalSettings] = useState(false);

      const [avatarBase64, setAvatarBase64] = useState('');

      const [editingSopKey, setEditingSopKey] = useState(null);
      const [editingSopContent, setEditingSopContent] = useState('');

      const [memberSearchQuery, setMemberSearchQuery] = useState('');
      const [message, setMessage] = useState(null);
      const [messageType, setMessageType] = useState('success');
      const [isSaving, setIsSaving] = useState(false);
      const [syncStatus, setSyncStatus] = useState('connecting');

      const showToast = (txt, type = 'success') => {
        setMessage(txt);
        setMessageType(type);
        setTimeout(() => setMessage(null), 3000);
      };

      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key !== 'Escape') return;
          setIsSuggestionModalOpen(false);
          setIsEditingSchedule(false);
          setIsSwapModalOpen(false);
          setIsRepairModalOpen(false);
          setIsMemberModalOpen(false);
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      useEffect(() => {
        if (!window.FirebaseSDK) return;
        const { initializeApp, getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, getFirestore } = window.FirebaseSDK;
        try {
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const firestore = getFirestore(app);
          setDb(firestore);
          setSyncStatus('authenticating');

          const initAuth = async () => {
            try {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
            } catch (e) {
              console.warn("Auth fallback:", e);
            }
          };
          initAuth();
          const unsubscribe = onAuthStateChanged(auth, (usr) => {
            setAuthUser(usr);
            setSyncStatus(usr ? 'connecting' : 'offline');
          });
          return () => unsubscribe();
        } catch (err) {
          console.error(err);
        }
      }, []);

      // 需求 3：支援跨裝置即時同步 (onSnapshot)
      useEffect(() => {
        if (!db || !authUser) return;
        const { collection, onSnapshot, doc, setDoc } = window.FirebaseSDK;

        const schedulesRef = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
        const annRef = collection(db, 'artifacts', appId, 'public', 'data', 'announcements');
        const suggestionsRef = collection(db, 'artifacts', appId, 'public', 'data', 'suggestions');
        const repairsRef = collection(db, 'artifacts', appId, 'public', 'data', 'repairs');
        const swapsRef = collection(db, 'artifacts', appId, 'public', 'data', 'swaps');
        const membersRef = collection(db, 'artifacts', appId, 'public', 'data', 'members');
        const sopRef = collection(db, 'artifacts', appId, 'public', 'data', 'sops');

        const unsubs = [];

        // 班表即時監聽（不強制寫入預設班表）
        unsubs.push(onSnapshot(schedulesRef, (snapshot) => {
          const list = snapshot.docs.map(d => d.data());
          list.sort((a, b) => {
            const aa = new Date(`${a.date || ''}T${(a.time || '00:00').split(' - ')[0] || '00:00'}`).getTime();
            const bb = new Date(`${b.date || ''}T${(b.time || '00:00').split(' - ')[0] || '00:00'}`).getTime();
            return aa - bb;
          });
          setSchedules(list);
          setSyncStatus('online');
        }, (err) => {
          console.error('Schedules listener error:', err);
          setSyncStatus('error');
        }));

        // 成員即時監聽
        unsubs.push(onSnapshot(membersRef, async (snapshot) => {
          if (snapshot.empty) {
            // 第一次建立資料庫時，把預設成員只初始化一次，之後所有裝置都讀同一份雲端資料。
            await Promise.all(INITIAL_MEMBERS.map(m => setDoc(doc(membersRef, m.id), m)));
            setMembers(INITIAL_MEMBERS);
            return;
          }
          const list = snapshot.docs.map(d => d.data());
          setMembers(list);
          setCurrentUser(prev => prev ? list.find(m => m.id === prev.id) || prev : null);
        }, (err) => {
          console.error('Members listener error:', err);
          setSyncStatus('error');
        }));

        // 公告即時監聽
        unsubs.push(onSnapshot(doc(annRef, 'main'), (snap) => {
          if (snap.exists() && snap.data().text) {
            setAnnouncement(snap.data().text);
          }
        }, (err) => {} ));

        // SOP 即時監聽
        unsubs.push(onSnapshot(doc(sopRef, 'main'), (snap) => {
          if (snap.exists() && snap.data().content) {
            setSopData(snap.data().content);
          }
        }, (err) => {} ));

        // 建議即時監聽
        unsubs.push(onSnapshot(suggestionsRef, (snapshot) => {
          const list = snapshot.docs.map(d => d.data());
          list.sort((a, b) => b.timestamp - a.timestamp);
          setLeaderSuggestions(list);
        }, (err) => {} ));

        // 報修即時監聽
        unsubs.push(onSnapshot(repairsRef, (snapshot) => {
          setRepairs(snapshot.docs.map(d => d.data()));
        }, (err) => {} ));

        // 換班即時監聽
        unsubs.push(onSnapshot(swapsRef, (snapshot) => {
          setSwaps(snapshot.docs.map(d => d.data()));
        }, (err) => {} ));

        return () => unsubs.forEach(unsub => unsub());
      }, [db, authUser]);

      useEffect(() => {
        if (window.lucide) {
          try { window.lucide.createIcons(); } catch(err) {}
        }
      });

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const password = loginPassword.trim();
        const foundMember = password ? members.find(m => String(m.password || '').toLowerCase() === password.toLowerCase()) : null;
        if (foundMember) {
          setCurrentUser(foundMember);
          setLoginPassword('');
          showToast(`歡迎回來，${foundMember.name}！`);
        } else {
          setLoginError('密碼錯誤，請重新確認');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        showToast('已安全登出');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setAvatarBase64(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      // 快速同步：UI 不再等待 Firebase 網路回應才關閉視窗。
      // 本地畫面先更新，雲端寫入在背景完成；失敗時再通知使用者。
      const syncToCloud = (collectionName, id, data, errorMessage) => {
        if (!db || !authUser) return Promise.reject(new Error('尚未連線到雲端'));
        const { doc, setDoc } = window.FirebaseSDK;
        setSyncStatus('syncing');
        return setDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id), data)
          .then(() => { setSyncStatus('online'); return true; })
          .catch(err => {
            console.error(`Firebase sync error [${collectionName}/${id}]`, err);
            setSyncStatus('error');
            showToast(errorMessage || '雲端同步失敗，請稍後重試', 'error');
            throw err;
          });
      };

      const deleteFromCloud = (collectionName, id, errorMessage) => {
        if (!db) return;
        const { doc, deleteDoc } = window.FirebaseSDK;
        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id))
          .catch(err => {
            console.error(`Firebase delete error [${collectionName}/${id}]`, err);
            showToast(errorMessage || '雲端刪除失敗，請稍後重試', 'error');
          });
      };

      // 需求 2：確保所有送出功能帶有容錯處理，保證必能寫入與送出
      const handlePostSuggestion = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const sugObj = {
          id: `sug-${Date.now()}`,
          authorId: currentUser.id,
          authorName: currentUser.name,
          authorTitle: currentUser.title,
          content: formData.get('content'),
          timestamp: Date.now()
        };

        setIsSaving(true);
        setLeaderSuggestions(prev => [sugObj, ...prev]);
        syncToCloud('suggestions', sugObj.id, sugObj, '公告同步失敗，請稍後重試').catch(() => {});
        showToast('組長公告/建議已發布！');
        setIsSuggestionModalOpen(false);
      };

      const handleDeleteSuggestion = async (sugId) => {
        if (confirm('確定要刪除這則公告/建議嗎？')) {
          deleteFromCloud('suggestions', sugId, '公告刪除同步失敗');
          setLeaderSuggestions(prev => prev.filter(s => s.id !== sugId));
          showToast('已刪除公告');
        }
      };

      const handleSaveSop = async (roleKey) => {
        const lines = editingSopContent.split('\n').filter(l => l.trim() !== '');
        const updatedSop = {
          ...sopData,
          [roleKey]: {
            ...sopData[roleKey],
            items: lines
          }
        };

        syncToCloud('sops', 'main', { content: updatedSop }, 'SOP 同步失敗，請稍後重試');
        setSopData(updatedSop);
        showToast('SOP 已成功更新！');
        setEditingSopKey(null);
      };

      const handleOpenScheduleModal = (sch = null) => {
        if (sch) setEditingScheduleData(JSON.parse(JSON.stringify(sch)));
        else {
          setEditingScheduleData({
            id: `sch-${Date.now()}`,
            date: new Date().toISOString().split('T')[0],
            title: '新朝會排班',
            time: '07:30 - 08:20',
            assignments: { director: [], audio: [], cam1: [], cam2: [], slides: [] }
          });
        }
        setShowAllForRole({});
        setIsEditingSchedule(true);
      };

      const handleToggleMemberAssignment = (roleKey, memberId) => {
        if (!editingScheduleData) return;
        setEditingScheduleData(prev => {
          if (!prev) return null;
          const assignments = prev.assignments || {};
          const currentList = Array.isArray(assignments[roleKey]) ? assignments[roleKey] : [];
          const isAssigned = currentList.includes(memberId);
          const newList = isAssigned ? currentList.filter(id => id !== memberId) : [...currentList, memberId];
          return { ...prev, assignments: { ...assignments, [roleKey]: newList } };
        });
      };

      const handleSaveScheduleSubmit = async (e) => {
        e.preventDefault();
        if (!editingScheduleData) return;
        setIsSaving(false);
        syncToCloud('schedules', editingScheduleData.id, editingScheduleData, '班表同步失敗，請稍後重試');
        setSchedules(prev => {
          const exists = prev.some(s => s.id === editingScheduleData.id);
          const updated = exists ? prev.map(s => s.id === editingScheduleData.id ? editingScheduleData : s) : [...prev, editingScheduleData];
          return updated.sort((a, b) => new Date(a.date) - new Date(b.date));
        });
        showToast('班表已儲存並即時同步！');
        setIsEditingSchedule(false);
        setEditingScheduleData(null);
      };

      const handleDeleteSchedule = (scheduleId, title) => {
        if (!confirm(`確定要刪除「${title || '這筆班表'}」嗎？`)) return;
        setSchedules(prev => prev.filter(s => s.id !== scheduleId));
        deleteFromCloud('schedules', scheduleId, '班表刪除同步失敗');
        showToast('班表已刪除');
      };

      const handleUpdateAnnouncement = async () => {
        const newAnn = prompt('編輯主要公告：', announcement);
        if (newAnn !== null) {
          syncToCloud('announcements', 'main', { text: newAnn }, '公告同步失敗，請稍後重試');
          setAnnouncement(newAnn);
          showToast('公告已廣播！');
        }
      };

      const handleRequestSwap = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const newSwap = {
          id: `sw-${Date.now()}`,
          requester: currentUser.name,
          targetDate: formData.get('targetDate'),
          roleLabel: formData.get('roleLabel'),
          reason: formData.get('reason'),
          status: 'pending'
        };
        syncToCloud('swaps', newSwap.id, newSwap, '申請同步失敗，請稍後重試');
        setSwaps(prev => [newSwap, ...prev]);
        showToast('請假/換班申請已送出！');
        setIsSwapModalOpen(false);
      };

      const handleUpdateSwapStatus = async (swapId, newStatus) => {
        const targetSwap = swaps.find(s => s.id === swapId);
        if (!targetSwap) return;
        const updated = { ...targetSwap, status: newStatus };
        syncToCloud('swaps', swapId, updated, '審核結果同步失敗');
        setSwaps(prev => prev.map(s => s.id === swapId ? updated : s));
        showToast(`已${newStatus === 'approved' ? '核准' : '駁回'}該請假申請！`);
      };

      const handleReportRepair = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const newRepair = {
          id: `r-${Date.now()}`,
          item: formData.get('item'),
          reporter: currentUser.name,
          date: new Date().toISOString().split('T')[0],
          issue: formData.get('issue'),
          status: 'pending'
        };
        syncToCloud('repairs', newRepair.id, newRepair, '報修同步失敗，請稍後重試');
        setRepairs(prev => [newRepair, ...prev]);
        showToast('報修單已提交！');
        setIsRepairModalOpen(false);
      };

      const handleSaveMemberSubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const finalAvatar = avatarBase64 || (editingMemberData ? editingMemberData.avatar : '');

        let memberObj;
        if (isPersonalSettings) {
          memberObj = {
            ...currentUser,
            name: formData.get('name'),
            password: formData.get('password'),
            avatar: finalAvatar
          };
        } else {
          memberObj = {
            id: editingMemberData ? editingMemberData.id : `m-${Date.now()}`,
            name: formData.get('name'),
            password: formData.get('password'),
            role: formData.get('role'),
            title: formData.get('title'),
            dept: formData.get('dept'),
            avatar: finalAvatar
          };
        }

                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                    <button type="button" onClick={() => setIsSuggestionModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" disabled={isSaving} className="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-xl font-bold">{isSaving ? '發布中…' : '確認發布'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isEditingSchedule && editingScheduleData && (
            <div className="modal-backdrop fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
              <div className="modal-card bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-2xl p-4 sm:p-5 shadow-2xl space-y-4 max-h-[92vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-700 pb-3 flex-shrink-0">
                  <h3 className="font-bold text-white text-base">編輯工作人員排班 (分組/跨組調度)</h3>
                  <button onClick={() => setIsEditingSchedule(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleSaveScheduleSubmit} className="space-y-4 text-xs overflow-y-auto pr-1 custom-scrollbar">
                  <div>
                    <label className="block text-slate-400 mb-1">朝會 / 活動名稱</label>
                    <input value={editingScheduleData.title || ''} onChange={(e) => setEditingScheduleData({...editingScheduleData, title: e.target.value})} required className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1">日期</label>
                      <input type="date" value={editingScheduleData.date || ''} onChange={(e) => setEditingScheduleData({...editingScheduleData, date: e.target.value})} required className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">時間</label>
                      <input value={editingScheduleData.time || ''} onChange={(e) => setEditingScheduleData({...editingScheduleData, time: e.target.value})} required className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>

                  <div className="space-y-4 border-t border-slate-700 pt-3">
                    <span className="font-bold text-indigo-400 block text-xs">指派崗位人員（可複選）：</span>
                    {DUTY_ROLES.map(role => {
                      const assignments = editingScheduleData.assignments || {};
                      const assignedIds = Array.isArray(assignments[role.key]) ? assignments[role.key] : [];
                      const isShowAll = !!showAllForRole[role.key];
                      
                      const deptMembers = members.filter(m => m.dept === role.deptKey || m.dept === 'admin');
                      
                      const roleOrderMap = { admin: 1, director: 2, audio: 3, cam1: 4, cam2: 5, slides: 6, intern: 7, member: 8 };
                      const fullListSorted = [...members].sort((a, b) => (roleOrderMap[a.dept] || 99) - (roleOrderMap[b.dept] || 99));
                      const renderList = isShowAll ? fullListSorted : deptMembers;

                      return (
                        <div key={role.key} className="bg-slate-900/80 p-3 rounded-xl border border-slate-700 space-y-2">
                          <div className="flex items-center justify-between text-xs font-bold text-slate-200">
                            <span className="flex items-center">
                              <span>{role.label}</span>
                              <span className="ml-2 text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded font-normal">已選 {assignedIds.length} 人</span>
                            </span>
                            <button type="button" onClick={() => setShowAllForRole({ ...showAllForRole, [role.key]: !isShowAll })} className="text-[11px] text-indigo-400 underline">
                              {isShowAll ? '僅顯示本組成員' : '+ 跨組支援'}
                            </button>
                          </div>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5 pt-1">
                            {renderList.map(m => {
                              const isChecked = assignedIds.includes(m.id);
                              return (
                                <button type="button" key={m.id} onClick={() => handleToggleMemberAssignment(role.key, m.id)} className={`p-2 rounded-lg text-xs flex items-center justify-between border transition-all ${isChecked ? 'bg-indigo-600 text-white font-bold border-indigo-400' : 'bg-slate-800 text-slate-300 border-slate-700'}`}>
                                  <div className="truncate text-left">
                                    <div className="truncate">{m.name}</div>
                                    <div className={`text-[9px] ${isChecked ? 'text-indigo-200' : 'text-slate-400'}`}>{m.title}</div>
                                  </div>
                                  <span className={`text-[10px] ml-1 px-1 rounded ${isChecked ? 'bg-indigo-700 text-white' : 'text-slate-500'}`}>{isChecked ? '✓' : '+'}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="flex justify-end space-x-2 pt-3 border-t border-slate-700 flex-shrink-0">
                    <button type="button" onClick={() => setIsEditingSchedule(false)} className="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" disabled={isSaving} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold disabled:opacity-50 disabled:cursor-not-allowed">{isSaving ? '同步中…' : '儲存並即時同步'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isSwapModalOpen && (
            <div className="modal-backdrop fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
              <div className="modal-card bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                  <h3 className="font-bold text-white text-sm">請假 / 換班申請</h3>
                  <button onClick={() => setIsSwapModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleRequestSwap} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">目標日期 (請選擇您被排程的班)</label>
                    <select name="targetDate" required className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
                      {userScheduledDates.length > 0 ? (
                        userScheduledDates.map((item, idx) => (
                          <option key={idx} value={item.date}>{item.date} - {item.title}</option>
                        ))
                      ) : (
                        <option value="" disabled>目前您近期無排程班表</option>
                      )}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">工作崗位</label>
                    <select name="roleLabel" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                      {DUTY_ROLES.map(r => <option key={r.key} value={r.label}>{r.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">請假理由</label>
                    <textarea name="reason" rows="2" required placeholder="說明事由..." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></textarea>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                    <button type="button" onClick={() => setIsSwapModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" disabled={userScheduledDates.length === 0} className="px-3 py-1.5 bg-indigo-600 text-white rounded-xl disabled:opacity-50 disabled:cursor-not-allowed">送出申請</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isRepairModalOpen && (
            <div className="modal-backdrop fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
              <div className="modal-card bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                  <h3 className="font-bold text-white text-sm">設備報修</h3>
                  <button onClick={() => setIsRepairModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleReportRepair} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">設備名稱</label>
                    <input name="item" required placeholder="例：Cam1 腳架" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">狀況描述</label>
                    <textarea name="issue" rows="2" required placeholder="說明問題..." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></textarea>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                    <button type="button" onClick={() => setIsRepairModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" className="px-3 py-1.5 bg-rose-600 text-white rounded-xl">提交</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isMemberModalOpen && (
            <div className="modal-backdrop fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
              <div className="modal-card bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                  <h3 className="font-bold text-white text-sm">
                    {isPersonalSettings ? '個人設定 (修改姓名/頭貼/密碼)' : (editingMemberData ? '編輯成員資料' : '新增成員')}
                  </h3>
                  <button onClick={() => setIsMemberModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleSaveMemberSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">姓名</label>
                    <input name="name" defaultValue={editingMemberData?.name || ''} required placeholder="例：許小華" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" />
                  </div>

                  {!isPersonalSettings && (
                    <>
                      <div>
                        <label className="block text-slate-400 mb-1">所屬組別</label>
                        <select name="dept" defaultValue={editingMemberData?.dept || 'director'} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                          <option value="admin">總召辦公室</option>
                          <option value="director">導播組</option>
                          <option value="audio">音控組</option>
                          <option value="cam1">CAM1 攝影組</option>
                          <option value="cam2">CAM2 攝影組</option>
                          <option value="slides">簡報組</option>
                          <option value="intern">實習生 / 支援</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">頭銜 / 職務</label>
                        <input name="title" defaultValue={editingMemberData?.title || '直播實習生'} required placeholder="例：導播組長、直播實習生" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" />
                      </div>
                    </>
                  )}

                  <div>
                    <label className="block text-slate-400 mb-1">上傳大頭貼照片檔案</label>
                    <input type="file" accept="image/*" onChange={handleImageUpload} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-1.5 text-slate-300 text-xs file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500" />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">登入密碼</label>
                    <input name="password" defaultValue={editingMemberData?.password || ''} required placeholder="例：31S999" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white font-mono" />
                  </div>

                  {!isPersonalSettings && currentUser.role === 'admin' && (
                    <div>
                      <label className="block text-slate-400 mb-1">系統權限層級</label>
                      <select name="role" defaultValue={editingMemberData?.role || 'member'} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                        <option value="member">組員 / 實習生</option>
                        <option value="leader">組長</option>
                        <option value="admin">老師 / 總召</option>
                      </select>
                    </div>
                  )}

                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                    <button type="button" onClick={() => setIsMemberModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" className="px-3 py-1.5 bg-indigo-600 text-white rounded-xl font-bold">確認儲存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
