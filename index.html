  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ===== Firebase 設定 =====
    // GitHub Pages 不會提供 __firebase_config，因此請把你的 Firebase Web App 設定貼在這裡。
    // Firebase Web App 的 config 不需要隱藏；真正的安全性請交給 Firestore Rules。
    const appId = 'live-stream-team-portal';
    const FIREBASE_CONFIG = {

    if (window.emailjs && EMAIL_CONFIG.publicKey && !EMAIL_CONFIG.publicKey.includes('請填入')) {
      try { window.emailjs.init({ publicKey: EMAIL_CONFIG.publicKey }); } catch (err) { console.error('EmailJS 初始化失敗:', err); }
    }

    const hasEmailConfig = !!(window.emailjs && EMAIL_CONFIG.publicKey && !EMAIL_CONFIG.publicKey.includes('請填入'));

    const INITIAL_MEMBERS = [
      { id: 'm1', name: '蔡孜鵬', password: '31V714', role: 'admin', title: '總召', dept: 'admin', avatar: '', email: '' },
      { id: 'm2', name: '洪睿頤', password: '31S441', role: 'leader', title: '導播組長', dept: 'director', avatar: '', email: '' },
      { id: 'm3', name: '蕭宥華', password: '31S442', role: 'leader', title: 'CAM2 組長', dept: 'camera', avatar: '', email: '' },
      { id: 'm4', name: '陳盈融', password: '31S276', role: 'leader', title: '音控組長', dept: 'audio', avatar: '', email: '' },
      { id: 'm10', name: '柯昱丞', password: '31S136', role: 'member', title: '導播組員', dept: 'director', avatar: '', email: '' },
      { id: 'm5', name: '楊奕璿', password: '41S285', role: 'member', title: '導播組員', dept: 'director', avatar: '', email: '' },
      { id: 'm6', name: '陳姿聿', password: '31V621', role: 'member', title: '音控組員', dept: 'audio', avatar: '', email: '' },
      { id: 'm7', name: '胡永璋', password: '41S465', role: 'member', title: '音控組員', dept: 'audio', avatar: '', email: '' },
      { id: 'm9', name: '黃芃瑀', password: '31V583', role: 'member', title: 'CAM1 攝影', dept: 'camera', avatar: '', email: '' },
      { id: 'm8', name: '戴士捷', password: '41V105', role: 'member', title: 'CAM2 攝影', dept: 'camera', avatar: '', email: '' }
    ];

    const DUTY_ROLES = [
      { key: 'director', label: '導播', deptKey: 'director', icon: 'tv' },
      { key: 'audio', label: '音控', deptKey: 'audio', icon: 'sliders' },
      { key: 'cam1', label: 'CAM1 攝影', deptKey: 'cam1', icon: 'camera' },
      { key: 'cam2', label: 'CAM2 攝影', deptKey: 'cam2', icon: 'video' },
      { key: 'slides', label: '簡報/字卡', deptKey: 'slides', icon: 'file-text' },
      { key: 'intern', label: '實習生', deptKey: 'intern', icon: 'graduation-cap' }
    ];

    // 權限分級：老師 / 總召同為最高權限；組員 / 實習生同為一般權限，但身分獨立顯示。
    const isHighPrivilege = (role) => role === 'admin' || role === 'teacher';
    const canManageSchedules = (role) => role === 'admin';
    const getRoleLabel = (role) => ({
      teacher: '老師',
      admin: '總召',
      leader: '組長',
      member: '組員',
      intern: '實習生'
    }[role] || '組員');

    // 需求 1：完全不要有任何預設班表
    const INITIAL_SCHEDULES = [];

    const INITIAL_SOP = {
      director: { title: '導播 操作說明與注意事項', items: ['07:20 前抵達導播室，開啟總電源與 OBS', '測試畫面切換'] },
      audio: { title: '音控 操作說明與注意事項', items: ['07:25 開啟混音器與麥克風', '檢查電池電量'] },
      cam1: { title: 'CAM1 操作說明與注意事項', items: ['設置於中央平台，調整水平儀'] },
      cam2: { title: 'CAM2 操作說明與注意事項', items: ['設置側邊特寫角度'] },
      slides: { title: '簡報 操作說明與注意事項', items: ['確認今日朝會 PPT 與名單'] }
    };

    function App() {
      const [db, setDb] = useState(null);
      const [authUser, setAuthUser] = useState(null);

      const [currentUser, setCurrentUser] = useState(null);
      const [loginMemberId, setLoginMemberId] = useState('');
      const [loginMemberSearch, setLoginMemberSearch] = useState('');
      const [loginDeptFilter, setLoginDeptFilter] = useState('all');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [members, setMembers] = useState(INITIAL_MEMBERS);
      const [schedules, setSchedules] = useState(INITIAL_SCHEDULES);
      const [repairs, setRepairs] = useState([]);
      const [swaps, setSwaps] = useState([]);
      const [announcement, setAnnouncement] = useState('📢 請全體成員於朝會前 10 分鐘完成所有設備校正！');
      const [leaderSuggestions, setLeaderSuggestions] = useState([]); 
      const [sopData, setSopData] = useState(INITIAL_SOP);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      const [isEditingSchedule, setIsEditingSchedule] = useState(false);
      const [scheduleManagementView, setScheduleManagementView] = useState('current');
      const [editingScheduleData, setEditingScheduleData] = useState(null);
      const [crossSupportRole, setCrossSupportRole] = useState(null);
      const [crossSupportDept, setCrossSupportDept] = useState('audio');

      const [isSwapModalOpen, setIsSwapModalOpen] = useState(false);
      const [isRepairModalOpen, setIsRepairModalOpen] = useState(false);
      const [isSuggestionModalOpen, setIsSuggestionModalOpen] = useState(false);

      const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
      const [editingMemberData, setEditingMemberData] = useState(null);
      const [isPersonalSettings, setIsPersonalSettings] = useState(false);
      const [memberFormRole, setMemberFormRole] = useState('member');
      const [selectedSwapDate, setSelectedSwapDate] = useState('');

      const [avatarBase64, setAvatarBase64] = useState('');

      const [editingSopKey, setEditingSopKey] = useState(null);
      const [editingSopContent, setEditingSopContent] = useState('');

      const [memberSearchQuery, setMemberSearchQuery] = useState('');
      const [message, setMessage] = useState(null);
      const [messageType, setMessageType] = useState('success');
      const [isSaving, setIsSaving] = useState(false);
      const [syncStatus, setSyncStatus] = useState('connecting');
      const [dialogState, setDialogState] = useState({ open: false, type: 'confirm', title: '', message: '', value: '', resolver: null });

      const requestConfirm = (message, title = '請確認操作') => new Promise(resolve => {
        setDialogState({ open: true, type: 'confirm', title, message, value: '', resolver: resolve });
      });
      const requestPrompt = (message, defaultValue = '', title = '請輸入內容') => new Promise(resolve => {
        setDialogState({ open: true, type: 'prompt', title, message, value: defaultValue || '', resolver: resolve });
      });
      const closeDialog = (result) => {
        const resolver = dialogState.resolver;
        setDialogState({ open: false, type: 'confirm', title: '', message: '', value: '', resolver: null });
        if (resolver) resolver(result);
      };

      const showToast = (txt, type = 'success') => {
        setMessage(txt);
        setMessageType(type);
        setTimeout(() => setMessage(null), 3000);
      };

      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key !== 'Escape') return;
          setIsSuggestionModalOpen(false);
          setIsEditingSchedule(false);
          setIsSwapModalOpen(false);
          setIsRepairModalOpen(false);
          setIsMemberModalOpen(false);
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      useEffect(() => {
        if (!window.FirebaseSDK) {
          setSyncStatus('error');
          return;
        }
        if (!hasRealFirebaseConfig) {
          setSyncStatus('offline');
          return;
        }
        const { initializeApp, getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, getFirestore } = window.FirebaseSDK;
        let unsubscribe = () => {};
        let cancelled = false;
        try {
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const firestore = getFirestore(app);
          setDb(firestore);
          setSyncStatus('authenticating');

          const initAuth = async () => {
            try {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
            } catch (e) {
              console.error('Firebase Authentication failed:', e);
              if (!cancelled) setSyncStatus('error');
            }
          };
          unsubscribe = onAuthStateChanged(auth, (usr) => {
            if (cancelled) return;
            setAuthUser(usr);
            setSyncStatus(usr ? 'connecting' : 'offline');
          }, (err) => {
            console.error('Firebase Auth state error:', err);
            if (!cancelled) setSyncStatus('error');
          });
          initAuth();
        } catch (err) {
          console.error('Firebase initialization failed:', err);
          setSyncStatus('error');
        }
        return () => { cancelled = true; unsubscribe(); };
      }, []);

      // 需求 3：支援跨裝置即時同步 (onSnapshot)
      useEffect(() => {
        if (!db || !authUser) return;
        const { collection, onSnapshot, doc, setDoc } = window.FirebaseSDK;

        const schedulesRef = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
        const annRef = collection(db, 'artifacts', appId, 'public', 'data', 'announcements');
        const suggestionsRef = collection(db, 'artifacts', appId, 'public', 'data', 'suggestions');
        const repairsRef = collection(db, 'artifacts', appId, 'public', 'data', 'repairs');
        const swapsRef = collection(db, 'artifacts', appId, 'public', 'data', 'swaps');
        const membersRef = collection(db, 'artifacts', appId, 'public', 'data', 'members');
        const sopRef = collection(db, 'artifacts', appId, 'public', 'data', 'sops');

        const unsubs = [];

        // 班表即時監聽（不強制寫入預設班表）
        unsubs.push(onSnapshot(schedulesRef, (snapshot) => {
          const list = snapshot.docs.map(d => ({ ...d.data(), id: d.data().id || d.id }));
          list.sort((a, b) => {
            const aa = new Date(`${a.date || ''}T${(a.time || '00:00').split(' - ')[0] || '00:00'}`).getTime();
            const bb = new Date(`${b.date || ''}T${(b.time || '00:00').split(' - ')[0] || '00:00'}`).getTime();
            return aa - bb;
          });
          setSchedules(list);
          setSyncStatus('online');
        }, (err) => {
          console.error('Schedules listener error:', err);
          setSyncStatus('error');
        }));

        // 成員即時監聽
        unsubs.push(onSnapshot(membersRef, async (snapshot) => {
          if (snapshot.empty) {
            // 第一次建立資料庫時，把預設成員只初始化一次，之後所有裝置都讀同一份雲端資料。
            await Promise.all(INITIAL_MEMBERS.map(m => setDoc(doc(membersRef, m.id), m)));
            setMembers(INITIAL_MEMBERS);
            return;
          }
          const list = snapshot.docs.map(d => d.data());
          setMembers(list);
          setCurrentUser(prev => prev ? list.find(m => m.id === prev.id) || prev : null);
        }, (err) => {
          console.error('Members listener error:', err);
          setSyncStatus('error');
        }));

        // 公告即時監聽
        unsubs.push(onSnapshot(doc(annRef, 'main'), (snap) => {
          if (snap.exists() && snap.data().text) {
            setAnnouncement(snap.data().text);
          }
        }, (err) => {} ));

        // 操作說明與注意事項 即時監聽
        unsubs.push(onSnapshot(doc(sopRef, 'main'), (snap) => {
          if (snap.exists() && snap.data().content) {
            setSopData(snap.data().content);
          }
        }, (err) => {} ));

        // 建議即時監聽
        unsubs.push(onSnapshot(suggestionsRef, (snapshot) => {
          const list = snapshot.docs.map(d => d.data());
          list.sort((a, b) => b.timestamp - a.timestamp);
          setLeaderSuggestions(list);
        }, (err) => {} ));

        // 報修即時監聽
        unsubs.push(onSnapshot(repairsRef, (snapshot) => {
          setRepairs(snapshot.docs.map(d => d.data()));
        }, (err) => {} ));

        // 換班即時監聽：以 Firebase 文件 ID 補回舊資料，並防止同一筆待審申請重複顯示。
        unsubs.push(onSnapshot(swapsRef, (snapshot) => {
          const seenIds = new Set();
          const seenPendingKeys = new Set();
          const list = [];
          snapshot.docs.forEach(d => {
            const data = { ...d.data(), id: d.data().id || d.id };
            if (seenIds.has(data.id)) return;
            if (data.status === 'pending') {
              const pendingKey = `${data.requesterId || data.requester || ''}|${data.targetDate || ''}|${data.roleLabel || ''}`;
              if (seenPendingKeys.has(pendingKey)) return;
              seenPendingKeys.add(pendingKey);
            }
            seenIds.add(data.id);
            list.push(data);
          });
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setSwaps(list);
        }, (err) => {
          console.error('Swaps listener error:', err);
        }));

        return () => unsubs.forEach(unsub => unsub());
      }, [db, authUser]);

      useEffect(() => {
        if (window.lucide) {
          try { window.lucide.createIcons(); } catch(err) {}
        }
      });

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const password = loginPassword.trim();
        const foundMember = members.find(m => m.id === loginMemberId);
        if (!foundMember) {
          setLoginError('請先選擇您的姓名');
          return;
        }
        if (!password) {
          setLoginError('請輸入個人密碼');
          return;
        }
        const isCorrect = String(foundMember.password || '').toLowerCase() === password.toLowerCase();
        if (isCorrect) {
          setCurrentUser(foundMember);
          setLoginPassword('');
          setLoginMemberId('');
          setLoginMemberSearch('');
          setLoginDeptFilter('all');
          showToast(`歡迎回來，${foundMember.name}！`);
        } else {
          setLoginError('密碼錯誤，請重新確認您的個人密碼');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        showToast('已安全登出');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setAvatarBase64(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      // 快速同步：UI 不再等待 Firebase 網路回應才關閉視窗。
      // 本地畫面先更新，雲端寫入在背景完成；失敗時再通知使用者。
      const syncToCloud = (collectionName, id, data, errorMessage) => {
        if (!db || !authUser) return Promise.reject(new Error('尚未連線到雲端'));
        const { doc, setDoc } = window.FirebaseSDK;
        setSyncStatus('syncing');
        return setDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id), data)
          .then(() => { setSyncStatus('online'); return true; })
          .catch(err => {
            console.error(`Firebase sync error [${collectionName}/${id}]`, err);
            setSyncStatus('error');
            showToast(errorMessage || '雲端同步失敗，請稍後重試', 'error');
            throw err;
          });
      };

      const deleteFromCloud = (collectionName, id, errorMessage) => {
        if (!db || !authUser) return Promise.reject(new Error('尚未連線到雲端'));
        const { doc, deleteDoc } = window.FirebaseSDK;
        setSyncStatus('syncing');
        return deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id))
          .then(() => { setSyncStatus('online'); return true; })
          .catch(err => {
            console.error(`Firebase delete error [${collectionName}/${id}]`, err);
            setSyncStatus('error');
            showToast(errorMessage || '雲端刪除失敗，請稍後重試', 'error');
            throw err;
          });
      };

      const getDepartmentLabel = (memberOrDept) => {
        const dept = typeof memberOrDept === 'string' ? memberOrDept : memberOrDept?.dept;
        const role = typeof memberOrDept === 'string' ? '' : memberOrDept?.role;
        return ({
          admin: '總召',
          office: '處室',
          director: '導播組',
          audio: '音控組',
          camera: '攝影組',
          cam1: '攝影組',
          cam2: '攝影組',
          slides: '簡報/字卡組',
          intern: '實習生'
        }[dept] || ({ teacher: '處室', admin: '總召', intern: '實習生' }[role]) || dept || '');
      };

      const getScheduleEndDate = (schedule) => {
        if (!schedule?.date) return null;
        const rawTime = String(schedule.time || '').trim();
        const parts = rawTime.split(/\s*-\s*/);
        const endTime = (parts[1] || parts[0] || '23:59').trim();
        const match = endTime.match(/(\d{1,2}):(\d{2})/);
        if (!match) return null;
        const hour = Number(match[1]);
        const minute = Number(match[2]);
        if (hour > 23 || minute > 59) return null;
        const end = new Date(`${schedule.date}T${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}:00`);
        return Number.isNaN(end.getTime()) ? null : end;
      };

      const isScheduleEnded = (schedule) => {
        const end = getScheduleEndDate(schedule);
        return !!end && end.getTime() < Date.now();
      };

      // ===== EmailJS 通知 =====
      const sendEmailSafely = async (templateId, templateParams) => {
        if (!templateParams?.to_email) return { ok: false, skipped: true, skippedRecipient: true };
        if (!hasEmailConfig) {
          console.warn('EmailJS 尚未設定 Public Key，略過寄信。');
          return { ok: false, skipped: true };
        }
        try {
          await window.emailjs.send(EMAIL_CONFIG.serviceId, templateId, templateParams);
          return { ok: true };
        } catch (err) {
          console.error('EmailJS 寄信失敗:', err);
          return { ok: false, error: err };
        }
      };

      const getMemberWorkRoles = (schedule, memberId) => DUTY_ROLES
        .filter(role => Array.isArray(schedule?.assignments?.[role.key]) && schedule.assignments[role.key].includes(memberId))
        .map(role => role.label);

      const notifyScheduleMembers = async (schedule) => {
        const grouped = new Map();
        DUTY_ROLES.forEach(role => {
          (Array.isArray(schedule?.assignments?.[role.key]) ? schedule.assignments[role.key] : []).forEach(memberId => {
            const member = members.find(m => m.id === memberId);
            if (!member?.email) return;
            const existing = grouped.get(member.id) || { member, roles: [] };
            if (!existing.roles.includes(role.label)) existing.roles.push(role.label);
            grouped.set(member.id, existing);
          });
        });
        let failed = 0;
        for (const { member, roles } of grouped.values()) {
          const result = await sendEmailSafely(EMAIL_CONFIG.scheduleTemplateId, {
            to_email: member.email,
            to_name: member.name,
            // 完全對應 EmailJS「工作通知」模板第一張圖的變數。
            mail_title: '工作通知',
            name: member.name,
            intro: `您已被安排以下直播工作：${roles.join('、')}\n\n活動：${schedule.title || '直播班表'}`,
            date: schedule.date || '',
            time: schedule.time || '',
            position: roles.join('、'),
            group: getDepartmentLabel(member),
            message: `請準時到場，謝謝。\n\n如有任何問題，請登入明道中學直播團隊系統查看。`,
            // 保留其他舊版欄位，避免既有模板或測試功能受影響。
            to_name: member.name,
            member_name: member.name,
            schedule_title: schedule.title || '直播班表',
            schedule_date: schedule.date || '',
            schedule_time: schedule.time || '',
            roles: roles.join('、'),
            work_roles: roles.join('、'),
            email: member.email,
            title: schedule.title || '直播班表',
            activity: schedule.title || '直播班表',
            role: roles.join('、'),
            work_role: roles.join('、'),
            work_role_label: roles.join('、'),
            department: getDepartmentLabel(member),
            content: `活動：${schedule.title || '直播班表'}｜日期：${schedule.date || ''}｜時間：${schedule.time || ''}｜工作：${roles.join('、')}`
          });
          if (!result.ok && !result.skipped) failed++;
        }
        return { sent: grouped.size - failed, failed, skipped: !hasEmailConfig };
      };

      const getWorkRoleForDate = (date, memberId = currentUser?.id) => {
        if (!date || !memberId) return '';
        const schedule = schedules.find(s => s.date === date);
        if (!schedule) return '';
        return getMemberWorkRoles(schedule, memberId).join('、');
      };

      // 需求 2：確保所有送出功能帶有容錯處理，保證必能寫入與送出
      const handlePostSuggestion = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const sugObj = {
          id: `sug-${Date.now()}`,
          authorId: currentUser.id,
          authorName: currentUser.name,
          authorTitle: currentUser.title,
          content: formData.get('content'),
          timestamp: Date.now()
        };

        setIsSaving(true);
        setLeaderSuggestions(prev => [sugObj, ...prev]);
        try {
          await syncToCloud('suggestions', sugObj.id, sugObj, '公告同步失敗，請稍後重試');

          setIsSuggestionModalOpen(false);

          // 保留視窗，讓使用者可以重試；避免按鈕永久卡在「發布中」。

          setIsSaving(false);

      };

      const handleDeleteSuggestion = async (sugId) => {
        if (!(await requestConfirm('確定要刪除這則公告/建議嗎？', '刪除公告 / 建議'))) return;
        try {
          await deleteFromCloud('suggestions', sugId, '公告刪除同步失敗，資料尚未刪除');
          setLeaderSuggestions(prev => prev.filter(s => s.id !== sugId));

      const handleSaveSop = async (roleKey) => {
        const lines = editingSopContent.split('\n').filter(l => l.trim() !== '');
        const updatedSop = {
          ...sopData,
          [roleKey]: {

      const handleOpenScheduleModal = (sch = null) => {
        if (!canManageSchedules(currentUser?.role)) {
          showToast('只有總召可以新增或編輯班表，老師不負責班表管理', 'error');
          return;
        }
        if (sch) {
          const cloned = JSON.parse(JSON.stringify(sch));
          const assignments = cloned.assignments || {};
          Object.keys(assignments).forEach(key => {
            const ids = Array.isArray(assignments[key]) ? assignments[key] : [];
            assignments[key] = [...new Set(ids)].filter(id => {
              const member = members.find(m => m.id === id);
              if (!member) return false;
              if (member.role === 'teacher') return false;
              if (member.role === 'intern') return key === 'intern';
              return key !== 'intern';
            });
          });
          cloned.assignments = assignments;
          setEditingScheduleData(cloned);
        } else {
          setEditingScheduleData({
            id: `sch-${Date.now()}`,
            date: new Date().toISOString().split('T')[0],
            title: '新朝會排班',

          });

        setCrossSupportRole(null);
        setCrossSupportDept('audio');

      };

      const handleToggleMemberAssignment = (roleKey, memberId) => {
        if (!editingScheduleData) return;
        setEditingScheduleData(prev => {
          if (!prev) return null;
          const assignments = prev.assignments || {};
          const currentList = Array.isArray(assignments[roleKey]) ? assignments[roleKey] : [];
          const isAssigned = currentList.includes(memberId);
          let nextAssignments = { ...assignments };

          if (isAssigned) {
            nextAssignments[roleKey] = currentList.filter(id => id !== memberId);
          } else {
            // 同一位攝影組成員只能擔任 CAM1 或 CAM2 其中一個，不能同時出現。
            if (roleKey === 'cam1' || roleKey === 'cam2') {
              const otherCamera = roleKey === 'cam1' ? 'cam2' : 'cam1';
              const otherList = Array.isArray(nextAssignments[otherCamera]) ? nextAssignments[otherCamera] : [];
              if (otherList.includes(memberId)) {
                nextAssignments[otherCamera] = otherList.filter(id => id !== memberId);
              }
            }
            nextAssignments[roleKey] = [...currentList, memberId];
          }
          return { ...prev, assignments: nextAssignments };
        });

      const handleSaveScheduleSubmit = async (e) => {
        e.preventDefault();
        if (!editingScheduleData || !canManageSchedules(currentUser?.role)) {
          showToast('只有總召可以修改班表，老師不負責班表管理', 'error');
          return;
        }
        if (!db || !authUser) {
          showToast('Firebase 尚未連線，班表沒有儲存。', 'error');
          setSyncStatus('error');
          return;
        }
        setIsSaving(true);
        try {
          const cleanedAssignments = {};
          DUTY_ROLES.forEach(role => {
            const ids = Array.isArray(editingScheduleData.assignments?.[role.key]) ? editingScheduleData.assignments[role.key] : [];
            cleanedAssignments[role.key] = [...new Set(ids)].filter(id => {
              const member = members.find(m => m.id === id);
              if (!member || member.role === 'teacher') return false;
              if (member.role === 'intern') return role.key === 'intern';
              if (role.key === 'cam1' || role.key === 'cam2') return member.dept === 'camera' || member.dept === 'cam1' || member.dept === 'cam2';
              return role.key !== 'intern';
            });
          });
          // 最後一道互斥檢查：同一天 CAM1 / CAM2 不允許同一人。
          const cam1Set = new Set(cleanedAssignments.cam1);
          cleanedAssignments.cam2 = cleanedAssignments.cam2.filter(id => !cam1Set.has(id));
          const scheduleToSave = { ...editingScheduleData, assignments: cleanedAssignments, updatedAt: Date.now(), updatedBy: currentUser.id, updatedByName: currentUser.name };
          const isNewSchedule = !schedules.some(s => s.id === scheduleToSave.id);
          await syncToCloud('schedules', scheduleToSave.id, scheduleToSave, '班表同步失敗，資料尚未儲存');
          setSchedules(prev => {
            const exists = prev.some(s => s.id === scheduleToSave.id);
            const updated = exists ? prev.map(s => s.id === scheduleToSave.id ? scheduleToSave : s) : [...prev, scheduleToSave];
            return updated.sort((a, b) => {
              const aa = new Date(`${a.date || ''}T${(a.time || '00:00').split(' - ')[0] || '00:00'}`).getTime();
              const bb = new Date(`${b.date || ''}T${(b.time || '00:00').split(' - ')[0] || '00:00'}`).getTime();
              return aa - bb;
            });
          });
          if (isNewSchedule) {
            const emailResult = await notifyScheduleMembers(scheduleToSave);
            if (emailResult.skipped) showToast('班表已儲存；EmailJS Public Key 尚未設定，因此未寄出通知。', 'error');
            else if (emailResult.failed > 0) showToast(`班表已儲存；有 ${emailResult.failed} 位成員通知寄送失敗。`, 'error');
            else if (emailResult.sent > 0) showToast(`班表已儲存，已寄送 ${emailResult.sent} 位成員的工作通知。`);
            else showToast('班表已儲存，但目前沒有可寄送 Email 的成員。');
          } else {
            showToast('班表已儲存到 Firebase，其他裝置會即時更新。');
          }
          setIsEditingSchedule(false);
          setEditingScheduleData(null);
        } catch (err) {
          // syncToCloud 已顯示錯誤；保留 Modal 讓總召可以重試
        } finally {
          setIsSaving(false);
        }
      };

      const handleDeleteSchedule = async (scheduleId, title) => {
        if (!canManageSchedules(currentUser?.role)) {
          showToast('只有總召可以刪除班表，老師不負責班表管理', 'error');
          return;
        }
        if (!(await requestConfirm(`確定要刪除「${title || '這筆班表'}」嗎？`, '刪除班表'))) return;
        if (!db || !authUser) {
          showToast('Firebase 尚未連線，班表沒有刪除。', 'error');
          return;
        }
        setIsSaving(true);
        try {
          await deleteFromCloud('schedules', scheduleId, '班表刪除同步失敗，資料尚未刪除');
          setSchedules(prev => prev.filter(s => s.id !== scheduleId));
          showToast('班表已從 Firebase 刪除，其他裝置會同步移除。');
        } catch (err) {
          console.error('刪除班表失敗:', err);
          const message = err?.code === 'permission-denied' ? 'Firebase 權限拒絕刪除：請在 Firestore Rules 允許 schedules 的 delete。' : `班表刪除失敗：${err?.message || '未知錯誤'}`;
          showToast(message, 'error');
        } finally {
          setIsSaving(false);
        }
      };

      const handleResendScheduleNotification = async (schedule) => {
        if (!canManageSchedules(currentUser?.role)) {
          showToast('只有總召可以再次通知班表，老師不負責班表管理', 'error');
          return;
        }
        const assignedCount = DUTY_ROLES.reduce((count, role) => {
          const ids = Array.isArray(schedule?.assignments?.[role.key]) ? schedule.assignments[role.key] : [];
          return count + ids.filter(id => members.some(m => m.id === id && m.email)).length;
        }, 0);
        if (!assignedCount) {
          showToast('這個活動目前沒有填寫 Email 的已指派成員。', 'error');
          return;
        }
        if (!(await requestConfirm(`確定要再次通知「${schedule.title || '這個活動'}」的所有已指派成員嗎？`, '再次通知'))) return;
        setIsSaving(true);
        try {
          const emailResult = await notifyScheduleMembers(schedule);
          if (emailResult.skipped) showToast('目前未設定 EmailJS Public Key，沒有寄出通知。', 'error');
          else if (emailResult.failed > 0) showToast(`再次通知完成，但有 ${emailResult.failed} 位成員寄送失敗。`, 'error');
          else if (emailResult.sent > 0) showToast(`已再次通知 ${emailResult.sent} 位成員。`);
          else showToast('沒有成功寄出的通知。', 'error');
        } finally {
          setIsSaving(false);
        }
      };

      const handleUpdateAnnouncement = async () => {
        const newAnn = await requestPrompt('請編輯要顯示給全體成員的主要公告：', announcement, '編輯主要公告');
        if (newAnn !== null) {
          syncToCloud('announcements', 'main', { text: newAnn }, '公告同步失敗，請稍後重試');
          setAnnouncement(newAnn);
          showToast('公告已廣播！');
        }
      };

      const handleRequestSwap = async (e) => {
        e.preventDefault();
        if (isSaving) return;

        const formData = new FormData(e.target);
        const targetDate = formData.get('targetDate');
        const workRole = getWorkRoleForDate(targetDate);
        if (!workRole) {
          showToast('這個日期找不到你的班表崗位，請重新選擇日期。', 'error');
          return;
        }

        // 防止同一人對同一日期／崗位重複送出待審申請。
        const duplicatePending = swaps.some(sw =>
          sw.status === 'pending' &&
          (sw.requesterId === currentUser.id || sw.requester === currentUser.name) &&
          sw.targetDate === targetDate &&
          sw.roleLabel === workRole
        );
        if (duplicatePending) {
          showToast('你已經有一筆相同日期與崗位的申請正在審核中，請勿重複送出。', 'error');
          return;
        }

        const newSwap = {
          id: `sw-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          requester: currentUser.name,
          requesterId: currentUser.id,
          requesterEmail: currentUser.email || '',
          targetDate,
          roleLabel: workRole,
          reason: formData.get('reason'),
          status: 'pending',
          reviewerNote: '',
          createdAt: Date.now()
        };

        setIsSaving(true);
        try {
          // 先寫入 Firebase，成功後才關閉申請視窗。
          await syncToCloud('swaps', newSwap.id, newSwap, '申請同步失敗，資料尚未送出');
          setSwaps(prev => {
            const filtered = prev.filter(sw => !(
              sw.status === 'pending' &&
              (sw.requesterId === newSwap.requesterId || sw.requester === newSwap.requester) &&
              sw.targetDate === newSwap.targetDate &&
              sw.roleLabel === newSwap.roleLabel
            ));
            return [newSwap, ...filtered];
          });

          const commonParams = {
            to_name: currentUser.name,
            mail_title: '請假／換班申請',
            name: currentUser.name,
            intro: '您提交的請假／換班申請如下：',
            date: targetDate || '',
            position: workRole || '',
            group: getDepartmentLabel(currentUser),
            reason: newSwap.reason || '',
            status: '審核中',
            review_note: '',
            message: '申請已送出，請等待總召審核。',
            member_name: currentUser.name,
            action: '請假／換班申請已送出',
            target_date: targetDate,
            work_role: workRole,
            reviewer_note: '',
            content: `日期：${targetDate}｜工作：${workRole}｜狀態：審核中｜原因：${newSwap.reason || ''}`
          };

          // 申請人自己的確認信（沒有 Email 就跳過，不影響申請）。
          const applicantEmailResult = await sendEmailSafely(EMAIL_CONFIG.swapTemplateId, {
            ...commonParams,
            to_email: currentUser.email || ''
          });

          // 同時通知所有有填寫 Email 的總召，讓總召知道有人提出申請。
          const adminRecipients = members.filter(m => (m.role === 'admin' || m.title === '總召') && m.email);
          let adminSent = 0;
          let adminFailed = 0;
          for (const admin of adminRecipients) {
            const result = await sendEmailSafely(EMAIL_CONFIG.swapTemplateId, {
              ...commonParams,
              to_email: admin.email,
              to_name: admin.name,
              mail_title: `新的請假／換班申請｜${currentUser.name}`,
              name: admin.name,
              intro: `${currentUser.name} 提出了一筆請假／換班申請，請登入系統審核：`,
              group: getDepartmentLabel(currentUser),
              message: `申請人：${currentUser.name}\n申請已送出，請登入明道中學直播團隊系統進行審核。`
            });
            if (result.ok) adminSent++;
            else if (!result.skipped) adminFailed++;
          }

          if (adminRecipients.length === 0) {
            showToast('申請已送出，但目前沒有任何「總召」成員填寫 Email，因此無法寄出總召提醒。', 'error');
          } else if (adminFailed > 0) {
            showToast(`申請已送出，已通知 ${adminSent} 位總召，但有 ${adminFailed} 封提醒寄送失敗。`, 'error');
          } else if (adminSent > 0) {
            showToast(`申請已送出，已通知 ${adminSent} 位總召。`);
          } else {
            showToast('申請已送出，但總召提醒沒有成功寄出。', 'error');
          }

          // Email 失敗不回滾 Firebase 申請；申請本身仍然成立。
          if (!applicantEmailResult.ok && !applicantEmailResult.skipped) {
            console.warn('申請人確認信寄送失敗，但申請已成功寫入 Firebase。');
          }

          setIsSwapModalOpen(false);
          setSelectedSwapDate('');
          if (e.target?.reset) e.target.reset();
        } catch (err) {
          console.error('送出請假／換班申請失敗:', err);
          showToast('申請送出失敗，請稍後再試。', 'error');

          setIsSaving(false);

      const handleUpdateSwapStatus = async (swapId, newStatus) => {

        const note = await requestPrompt('請填寫這筆請假／換班申請的審核備注（可留空）：', targetSwap.reviewerNote || '', '請假／換班審核備注');

          const emailResult = await sendEmailSafely(EMAIL_CONFIG.swapTemplateId, {
            to_email: targetSwap.requesterEmail || (members.find(m => m.id === targetSwap.requesterId)?.email || ''),
            to_name: targetSwap.requester,

            mail_title: `請假／換班申請${statusText}`,
            name: targetSwap.requester,
            intro: `您的請假／換班申請${statusText}：`,
            date: targetSwap.targetDate || '',
            position: targetSwap.roleLabel || '',
            group: getDepartmentLabel(members.find(x => x.id === targetSwap.requesterId)),
            reason: targetSwap.reason || '',
            status: statusText,
            review_note: note || '',
            message: `申請${statusText}。${note ? `審核備注：${note}` : ''}`,
            // 保留程式既有欄位。
            member_name: targetSwap.requester,
            action: `請假／換班申請${statusText}`,
            target_date: targetSwap.targetDate,
            work_role: targetSwap.roleLabel,
            reviewer_note: note || '',
            content: `日期：${targetSwap.targetDate || ''}｜工作：${targetSwap.roleLabel || ''}｜狀態：${statusText}｜審核備注：${note || '無'}`
          });
          if (emailResult.ok) showToast(`已${newStatus === 'approved' ? '核准' : '駁回'}該請假申請，結果通知已寄出！`);
          else if (emailResult.skipped) showToast(`已${newStatus === 'approved' ? '核准' : '駁回'}；EmailJS Public Key 尚未設定，因此未寄出結果通知。`, 'error');
          else showToast(`已${newStatus === 'approved' ? '核准' : '駁回'}，但結果通知寄送失敗。`, 'error');

              <div className="modal-card bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-2xl p-4 sm:p-5 shadow-2xl space-y-4 max-h-[92vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-700 pb-3 flex-shrink-0">
                  <h3 className="font-bold text-white text-base">{editingScheduleData?.id ? '編輯班表・指派工作人員' : '新增班表・指派工作人員'}</h3>
                  <button onClick={() => setIsEditingSchedule(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleSaveScheduleSubmit} className="space-y-4 text-xs overflow-y-auto pr-1 custom-scrollbar">
                  <div>
                    <label className="block text-slate-400 mb-1">朝會 / 活動名稱</label>
                    <input value={editingScheduleData.title || ''} onChange={(e) => setEditingScheduleData({...editingScheduleData, title: e.target.value})} required className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1">日期</label>
                      <input type="date" value={editingScheduleData.date || ''} onChange={(e) => setEditingScheduleData({...editingScheduleData, date: e.target.value})} required className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">時間</label>
                      <input value={editingScheduleData.time || ''} onChange={(e) => setEditingScheduleData({...editingScheduleData, time: e.target.value})} required className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>

                  <div className="space-y-3 border-t border-slate-700 pt-3">
                    <div>
                      <span className="font-bold text-indigo-400 block text-xs mb-2">指派崗位人員</span>
                    </div>

                    {DUTY_ROLES.map(role => {
                      const assignments = editingScheduleData.assignments || {};
                      const assignedIds = Array.isArray(assignments[role.key]) ? assignments[role.key] : [];
                      // 老師不屬於任何班表崗位；實習生只出現在「實習生」崗位。
                      // 總召仍可被指派，因此保留 admin；老師雖同為最高權限，不能被選入班表。
                      const deptMembers = role.key === 'intern'
                        ? members.filter(m => m.role === 'intern')
                        : (role.key === 'cam1' || role.key === 'cam2')
                          ? members.filter(m => m.role !== 'teacher' && m.role !== 'intern' && (m.dept === 'cam1' || m.dept === 'cam2' || m.dept === 'camera'))
                          : members.filter(m => m.role !== 'teacher' && m.role !== 'intern' && (m.dept === role.deptKey || m.role === 'admin'));
                      const selectedMembers = assignedIds.map(id => members.find(m => m.id === id)).filter(Boolean);
                      const isCrossOpen = crossSupportRole === role.key;
                      const supportMembers = crossSupportDept === 'intern'
                        ? members.filter(m => m.role === 'intern')
                        : (crossSupportDept === 'cam1' || crossSupportDept === 'cam2')
                          ? members.filter(m => m.role !== 'teacher' && m.role !== 'intern' && (m.dept === 'cam1' || m.dept === 'cam2' || m.dept === 'camera'))
                          : members.filter(m => m.role !== 'teacher' && m.role !== 'intern' && (m.dept === crossSupportDept || (crossSupportDept === 'camera' && (m.dept === 'cam1' || m.dept === 'cam2' || m.dept === 'camera')) || m.role === 'admin'));

                      return <div key={role.key} className="bg-slate-900/80 p-3 rounded-xl border border-slate-700 space-y-2">
                        <div className="flex items-center justify-between text-xs font-bold text-slate-200">
                          <span>{role.label} <span className="ml-1 text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded font-normal">已選 {assignedIds.length} 人</span></span>
                          <button type="button" onClick={() => { setCrossSupportRole(isCrossOpen ? null : role.key); if (!isCrossOpen) setCrossSupportDept(DUTY_ROLES.find(r => r.key !== role.key)?.deptKey || 'audio'); }} className="text-[11px] text-indigo-400 underline whitespace-nowrap">
                            {isCrossOpen ? '收起跨組支援' : '+ 跨組支援'}
                          </button>
                        </div>

                        {selectedMembers.length > 0 && <div className="rounded-lg bg-indigo-950/60 border border-indigo-700/50 p-2">
                          <div className="text-[10px] text-indigo-300 mb-1">目前 {role.label} 已選：</div>
                          <div className="flex flex-wrap gap-1.5">
                            {selectedMembers.map(m => <span key={`${role.key}-selected-${m.id}`} className="inline-flex items-center gap-1 bg-indigo-600/80 text-white rounded-md px-2 py-1 text-[10px]">✓ {m.name}</span>)}
                          </div>
                        </div>}

                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5 pt-1">
                          {deptMembers.map(m => {
                            const isChecked = assignedIds.includes(m.id);
                            const otherCamera = role.key === 'cam1' ? 'cam2' : role.key === 'cam2' ? 'cam1' : null;
                            const isCameraConflict = !!otherCamera && Array.isArray(assignments[otherCamera]) && assignments[otherCamera].includes(m.id) && !isChecked;
                            return <button type="button" key={m.id} disabled={isCameraConflict} onClick={() => handleToggleMemberAssignment(role.key, m.id)} className={`p-2 rounded-lg text-xs flex items-center justify-between border transition-all ${isChecked ? 'bg-indigo-600 text-white font-bold border-indigo-400' : isCameraConflict ? 'bg-slate-950 text-slate-600 border-slate-800 cursor-not-allowed opacity-60' : 'bg-slate-800 text-slate-300 border-slate-700'}`}>
                              <div className="truncate text-left"><div className="truncate">{m.name}</div><div className={`text-[9px] ${isChecked ? 'text-indigo-200' : 'text-slate-400'}`}>{m.title}</div></div>
                              <span className={`text-[10px] ml-1 px-1 rounded ${isChecked ? 'bg-indigo-700 text-white' : 'text-slate-500'}`}>{isChecked ? '✓' : '+'}</span>
                            </button>;
                          })}
                        </div>

                        {isCrossOpen && <div className="mt-2 rounded-lg border border-indigo-700/60 bg-indigo-950/40 p-2.5 space-y-2">
                          <div className="text-[10px] font-bold text-indigo-300">跨組支援：先選組別，再選人員</div>
                          <select value={crossSupportDept} onChange={e => setCrossSupportDept(e.target.value)} className="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white text-xs outline-none focus:border-indigo-500">
                            {DUTY_ROLES.filter(r => r.key !== role.key && !(('cam1' === role.key || 'cam2' === role.key) && (r.key === 'cam1' || r.key === 'cam2'))).map(r => (r.key === 'cam1' ? <option key="camera-group" value="camera">攝影組</option> : r.key === 'cam2' ? null : <option key={r.key} value={r.deptKey}>{r.label}</option>))}
                          </select>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
                            {supportMembers.map(m => {
                              const isChecked = assignedIds.includes(m.id);
                              const otherCamera = role.key === 'cam1' ? 'cam2' : role.key === 'cam2' ? 'cam1' : null;
                              const isCameraConflict = !!otherCamera && Array.isArray(assignments[otherCamera]) && assignments[otherCamera].includes(m.id) && !isChecked;
                              return <button type="button" key={`support-${role.key}-${m.id}`} disabled={isCameraConflict} onClick={() => handleToggleMemberAssignment(role.key, m.id)} className={`p-2 rounded-lg text-xs flex items-center justify-between border transition-all ${isChecked ? 'bg-indigo-600 text-white font-bold border-indigo-400' : isCameraConflict ? 'bg-slate-950 text-slate-600 border-slate-800 cursor-not-allowed opacity-60' : 'bg-slate-800 text-slate-300 border-slate-700'}`}>
                                <div className="truncate text-left"><div className="truncate">{m.name}</div><div className={`text-[9px] ${isChecked ? 'text-indigo-200' : 'text-slate-400'}`}>{m.title}</div></div>
                                <span className={`text-[10px] ml-1 px-1 rounded ${isChecked ? 'bg-indigo-700 text-white' : 'text-slate-500'}`}>{isChecked ? '✓' : '+'}</span>
                              </button>;
                            })}
                          </div>
                        </div>}
                      </div>;
                    })}

                    <div className="rounded-lg border border-slate-700 bg-slate-900/50 px-3 py-2">
                      <div className="text-[10px] text-slate-400 mb-1">以下為已選取之人選：</div>
                      <div className="flex flex-wrap gap-1.5">
                        {DUTY_ROLES.flatMap(role => ((editingScheduleData.assignments || {})[role.key] || []).map(id => {
                          const m = members.find(x => x.id === id);
                          return m ? <span key={`${role.key}-preview-${id}`} className="inline-flex items-center gap-1 bg-slate-800 text-slate-300 border border-slate-700 rounded-md px-2 py-1 text-[10px]">{role.label} · {m.name}</span> : null;
                        })).filter(Boolean)}
                        {DUTY_ROLES.every(role => !((editingScheduleData.assignments || {})[role.key] || []).length) && <span className="text-[10px] text-slate-500">尚未選擇人員</span>}
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center justify-between gap-3 pt-3 border-t border-slate-700 flex-shrink-0">
                    <span className="text-[10px] text-slate-500">修改內容後按「儲存班表」，才會同步到所有裝置。</span>
                    <button type="button" onClick={() => setIsEditingSchedule(false)} className="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" disabled={isSaving} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold disabled:opacity-50 disabled:cursor-not-allowed">{isSaving ? '儲存中…' : '儲存班表'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isSwapModalOpen && (
            <div className="modal-backdrop fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
              <div className="modal-card bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                  <h3 className="font-bold text-white text-sm">請假 / 換班申請</h3>
                  <button onClick={() => setIsSwapModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleRequestSwap} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">目標日期 (請選擇您被排程的班)</label>
                    <select name="targetDate" value={selectedSwapDate || userScheduledDates[0]?.date || ''} onChange={e => setSelectedSwapDate(e.target.value)} required className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
                      {userScheduledDates.length > 0 ? (
                        userScheduledDates.map((item, idx) => (
                          <option key={idx} value={item.date}>{item.date} - {item.title}</option>
                        ))
                      ) : (
                        <option value="" disabled>目前您近期無排程班表</option>
                      )}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">工作崗位（依日期自動判斷）</label>
                    <input type="hidden" name="roleLabel" value={getWorkRoleForDate(selectedSwapDate)} />
                    <div className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white min-h-[42px]">
                      {getWorkRoleForDate(selectedSwapDate) || '請先選擇你被排程的日期'}
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">請假理由</label>
                    <textarea name="reason" rows="2" required placeholder="說明事由..." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></textarea>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                    <button type="button" onClick={() => setIsSwapModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" disabled={isSaving || userScheduledDates.length === 0 || !getWorkRoleForDate(selectedSwapDate || userScheduledDates[0]?.date)} className="px-3 py-1.5 bg-indigo-600 text-white rounded-xl font-bold disabled:opacity-50 disabled:cursor-not-allowed">{isSaving ? '送出中…' : '送出申請'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isRepairModalOpen && (
            <div className="modal-backdrop fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
              <div className="modal-card bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                  <h3 className="font-bold text-white text-sm">設備報修</h3>
                  <button onClick={() => setIsRepairModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleReportRepair} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">設備名稱</label>
                    <input name="item" required placeholder="例：Cam1 腳架" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">狀況描述</label>
                    <textarea name="issue" rows="2" required placeholder="說明問題..." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></textarea>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                    <button type="button" onClick={() => setIsRepairModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" className="px-3 py-1.5 bg-rose-600 text-white rounded-xl">提交</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isMemberModalOpen && (
            <div className="modal-backdrop fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
              <div className="modal-card bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                  <h3 className="font-bold text-white text-sm">
                    {isPersonalSettings ? '個人設定 (修改姓名/頭貼/密碼)' : (editingMemberData ? '編輯成員資料' : '新增成員')}
                  </h3>
                  <button onClick={() => setIsMemberModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleSaveMemberSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">姓名</label>
                    <input name="name" defaultValue={editingMemberData?.name || ''} required placeholder="例：許小華" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" />
                  </div>

                  {!isPersonalSettings && (
                    <>
                      <div>
                        <label className="block text-slate-400 mb-1">所屬組別</label>
                        <select name="dept" defaultValue={(['cam1','cam2','camera'].includes(editingMemberData?.dept) ? 'camera' : (editingMemberData?.dept || 'director'))} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                          <option value="admin">總召</option>
                          <option value="director">導播組</option>
                          <option value="audio">音控組</option>
                          <option value="camera">攝影組</option>
                          <option value="slides">簡報組</option>
                          <option value="intern">實習生</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">頭銜 / 職務</label>
                        <input name="title" defaultValue={editingMemberData?.title || '直播實習生'} required placeholder="例：導播組長、直播實習生" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div><label className="block text-slate-400 mb-1">{memberFormRole === 'teacher' ? '處室' : '班級'}</label><input name="className" defaultValue={editingMemberData?.className || ''} placeholder={memberFormRole === 'teacher' ? '例：學務處、教務處' : '例：高二乙'} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" /></div>
                        <div><label className="block text-slate-400 mb-1">Email</label><input type="email" name="email" defaultValue={editingMemberData?.email || ''} placeholder="name@example.com" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" /></div>
                      </div>
                    </>
                  )}

                  <div>
                    <label className="block text-slate-400 mb-1">上傳大頭貼照片檔案</label>
                    <input type="file" accept="image/*" onChange={handleImageUpload} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-1.5 text-slate-300 text-xs file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500" />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">登入密碼</label>
                    <input name="password" defaultValue={editingMemberData?.password || ''} required placeholder="例：31S999" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white font-mono" />
                  </div>

                  {!isPersonalSettings && isHighPrivilege(currentUser.role) && (
                    <div>
                      <label className="block text-slate-400 mb-1">系統權限層級</label>
                      <select name="role" value={memberFormRole} onChange={e => setMemberFormRole(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                        <option value="member">組員</option>
                        <option value="intern">實習生</option>
                        <option value="leader">組長</option>
                        <option value="teacher">老師</option>
                        <option value="admin">總召</option>
                      </select>
                    </div>
                  )}

                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                    <button type="button" onClick={() => setIsMemberModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" className="px-3 py-1.5 bg-indigo-600 text-white rounded-xl font-bold">確認儲存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
