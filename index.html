  <style>

    @keyframes toastIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }

    /* ===== MDMT 星球主題視覺升級 ===== */
    :root { --mdmt-bg:#030b1d; --mdmt-border:rgba(96,165,250,.20); }

    .app-shell::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.30; background-image:radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(125,211,252,.55) 0 1px,transparent 1.5px); background-size:97px 113px,151px 167px; background-position:13px 22px,61px 47px; mask-image:linear-gradient(to bottom,black,transparent 82%); z-index:0; }

    .from-indigo-500.to-rose-500 { background:linear-gradient(135deg,#2563eb,#0ea5e9) !important; }

    /* ===== MDMT 攝影 × 直播 × 星球質感視覺 ===== */
    .mdmt-media-strip { position:relative; overflow:hidden; border-radius:1.35rem; border:1px solid rgba(96,165,250,.22); background:radial-gradient(circle at 15% 20%,rgba(59,130,246,.20),transparent 28%),radial-gradient(circle at 85% 80%,rgba(14,165,233,.12),transparent 30%),linear-gradient(120deg,rgba(2,12,29,.96),rgba(7,28,60,.86) 55%,rgba(2,10,25,.96)); box-shadow:0 24px 70px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05); }
    .mdmt-media-strip::before { content:""; position:absolute; inset:-45% -10%; pointer-events:none; background:conic-gradient(from 210deg at 50% 50%,transparent 0 34%,rgba(96,165,250,.08) 36%,transparent 42% 100%); animation:mdmtOrbit 18s linear infinite; }
    .mdmt-media-strip::after { content:""; position:absolute; width:360px; height:360px; right:-150px; top:-190px; border:1px solid rgba(125,211,252,.13); border-radius:50%; box-shadow:0 0 0 28px rgba(96,165,250,.035),0 0 0 58px rgba(96,165,250,.025); pointer-events:none; }
    @keyframes mdmtOrbit { to { transform:rotate(360deg); } }
    .mdmt-media-grid { position:relative; z-index:1; display:grid; grid-template-columns:1.35fr 1fr 1fr; gap:10px; }
    .mdmt-media-card { min-height:142px; position:relative; overflow:hidden; border-radius:1.05rem; border:1px solid rgba(148,163,184,.14); background:rgba(3,13,31,.58); box-shadow:inset 0 1px 0 rgba(255,255,255,.04); backdrop-filter:blur(12px); }
    .mdmt-camera-lens { position:absolute; width:108px; height:108px; left:24px; top:18px; border-radius:50%; background:radial-gradient(circle at 38% 34%,#60a5fa 0 7%,#172554 8% 25%,#020617 26% 43%,#2563eb 44% 49%,#0b1733 50% 63%,#60a5fa 64% 67%,#071329 68%); box-shadow:0 0 35px rgba(37,99,235,.22),inset 0 0 18px rgba(255,255,255,.08); }
    .mdmt-camera-body { position:absolute; left:76px; top:47px; width:142px; height:68px; border-radius:15px; background:linear-gradient(145deg,#334155,#0f172a 65%); border:1px solid rgba(148,163,184,.25); transform:skewX(-4deg); box-shadow:0 18px 35px rgba(0,0,0,.32); }
    .mdmt-camera-top { position:absolute; left:102px; top:35px; width:55px; height:17px; border-radius:7px 7px 2px 2px; background:#1e293b; border:1px solid rgba(148,163,184,.20); }
    .mdmt-camera-screen { position:absolute; right:15px; top:14px; width:37px; height:24px; border-radius:4px; background:linear-gradient(135deg,#0ea5e9,#1d4ed8); box-shadow:0 0 15px rgba(14,165,233,.35); }
    .mdmt-live-dot { width:7px; height:7px; border-radius:50%; background:#fb7185; box-shadow:0 0 14px rgba(251,113,133,.85); display:inline-block; animation:mdmtPulse 1.5s ease-in-out infinite; }
    @keyframes mdmtPulse { 50% { opacity:.45; transform:scale(.82); } }
    .mdmt-wave { position:absolute; inset:40px 18px 25px; display:flex; align-items:center; justify-content:center; gap:4px; }
    .mdmt-wave i { display:block; width:4px; border-radius:999px; background:linear-gradient(#60a5fa,#22d3ee); box-shadow:0 0 9px rgba(34,211,238,.22); }
    .mdmt-wave i:nth-child(1){height:18%}.mdmt-wave i:nth-child(2){height:34%}.mdmt-wave i:nth-child(3){height:58%}.mdmt-wave i:nth-child(4){height:86%}.mdmt-wave i:nth-child(5){height:48%}.mdmt-wave i:nth-child(6){height:72%}.mdmt-wave i:nth-child(7){height:38%}.mdmt-wave i:nth-child(8){height:66%}.mdmt-wave i:nth-child(9){height:28%}.mdmt-wave i:nth-child(10){height:52%}.mdmt-wave i:nth-child(11){height:78%}.mdmt-wave i:nth-child(12){height:40%}.mdmt-wave i:nth-child(13){height:24%}
    .mdmt-scope { position:absolute; width:128px; height:128px; right:22px; top:8px; border-radius:50%; border:1px solid rgba(96,165,250,.20); box-shadow:0 0 0 18px rgba(96,165,250,.025),0 0 0 38px rgba(96,165,250,.018); }
    .mdmt-scope::before,.mdmt-scope::after { content:""; position:absolute; background:rgba(125,211,252,.20); }
    .mdmt-scope::before { width:1px; height:100%; left:50%; top:0; }.mdmt-scope::after { height:1px; width:100%; top:50%; left:0; }
    .mdmt-scope-dot { position:absolute; left:50%; top:50%; width:8px; height:8px; transform:translate(-50%,-50%); border-radius:50%; background:#7dd3fc; box-shadow:0 0 18px #38bdf8; }
    .mdmt-label { position:absolute; left:16px; bottom:13px; z-index:2; font-size:10px; letter-spacing:.16em; font-weight:800; color:#bfdbfe; }
    .mdmt-label small { display:block; margin-top:3px; letter-spacing:.04em; font-weight:500; color:#64748b; }
    .mdmt-status-line { position:absolute; right:16px; bottom:14px; z-index:2; font-size:9px; color:#94a3b8; letter-spacing:.12em; }
    .mdmt-glow-title { text-shadow:0 0 24px rgba(96,165,250,.20); }

    .mdmt-media-compact { min-height:64px; border-radius:1rem; }
    .mdmt-mini-camera { width:34px; height:22px; border:1px solid rgba(96,165,250,.35); border-radius:6px; background:linear-gradient(145deg,rgba(30,64,175,.28),rgba(2,12,29,.72)); position:relative; box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
    .mdmt-mini-camera::before { content:""; position:absolute; left:7px; top:-5px; width:12px; height:5px; border-radius:3px 3px 0 0; background:rgba(96,165,250,.28); border:1px solid rgba(96,165,250,.25); border-bottom:0; }
    .mdmt-mini-camera span { position:absolute; width:9px; height:9px; border-radius:50%; border:2px solid rgba(96,165,250,.85); left:11px; top:5px; box-shadow:0 0 10px rgba(59,130,246,.35); }
    .mdmt-mini-wave { display:flex; align-items:center; gap:3px; height:22px; opacity:.8; }
    .mdmt-mini-wave i { width:2px; border-radius:2px; background:#38bdf8; height:7px; }
    .mdmt-mini-wave i:nth-child(2),.mdmt-mini-wave i:nth-child(6){height:14px}.mdmt-mini-wave i:nth-child(3),.mdmt-mini-wave i:nth-child(5){height:18px}.mdmt-mini-wave i:nth-child(4){height:22px}
    .mdmt-mini-orbit { width:28px; height:28px; border:1px solid rgba(125,211,252,.35); border-radius:50%; position:relative; }
    .mdmt-mini-orbit::before { content:""; position:absolute; left:3px; right:3px; top:12px; border-top:1px solid rgba(125,211,252,.25); transform:rotate(-18deg); }
    .mdmt-mini-orbit span { position:absolute; width:5px; height:5px; border-radius:50%; background:#7dd3fc; left:11px; top:10px; box-shadow:0 0 8px rgba(125,211,252,.7); }

    @media (max-width:900px){ .mdmt-media-grid{grid-template-columns:1fr 1fr}.mdmt-media-card:first-child{grid-column:1/-1} }
    @media (max-width:560px){ .mdmt-media-grid{grid-template-columns:1fr}.mdmt-media-card:first-child{grid-column:auto} .mdmt-media-card{min-height:120px} }


    /* ===== 介面精緻化（版面微調，不改整體架構） ===== */
    body { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; letter-spacing:.01em; }
    h1,h2,h3 { letter-spacing:.02em; }
    .custom-scrollbar::-webkit-scrollbar { width:6px; height:6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background:rgba(96,165,250,.28); }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background:rgba(96,165,250,.45); }
    .custom-scrollbar::-webkit-scrollbar-track { background:rgba(2,12,29,.6); }
    .overflow-x-auto { scrollbar-width:thin; scrollbar-color:rgba(96,165,250,.3) transparent; }
    table { border-collapse:separate; border-spacing:0; }
    thead th { position:sticky; top:0; z-index:1; font-weight:700; letter-spacing:.04em; background:rgba(7,25,53,.96) !important; border-bottom:1px solid rgba(96,165,250,.20); }
    tbody tr { transition:background-color .15s ease; }
    tbody tr:nth-child(even) { background-color:rgba(37,99,235,.035); }
    tbody tr:hover { background-color:rgba(37,99,235,.12) !important; }
    .rounded-xl, .rounded-2xl { transition:border-color .18s ease, box-shadow .18s ease, background-color .18s ease; }
    .glass-panel:hover { border-color:rgba(96,165,250,.28) !important; }
    button { transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .12s ease, filter .15s ease; }
    button:active:not(:disabled) { transform:scale(.98); }
    button:disabled { cursor:not-allowed; }
    input, select, textarea { transition:border-color .15s ease, box-shadow .15s ease; border-radius:.75rem; }
    input::placeholder, textarea::placeholder { color:rgba(148,163,184,.55); }
    .modal-card, .glass-panel.rounded-2xl { box-shadow:0 24px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05) !important; }
    .min-w-0 { min-width:0; }
    @media (max-width:767px) { html { font-size:16px; } .glass-panel { border-radius:1rem; } }

    /* ===== 表格與輸入框微調 ===== */
    thead th { background:#0a1a36 !important; border-bottom:1px solid rgba(148,163,184,.2); letter-spacing:0; }
    tbody tr:nth-child(even) { background-color:rgba(148,163,184,.04); }
    tbody tr:hover { background-color:rgba(59,130,246,.10) !important; }
    input, select, textarea { border-radius:.625rem; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:#3b82f6 !important; box-shadow:0 0 0 2px rgba(59,130,246,.2); }

    .nav-group-label { font-size:.72rem; font-weight:600; letter-spacing:.06em; color:#64748b; padding:.95rem .9rem .3rem; }
    nav .nav-group-label:first-child { padding-top:.2rem; }

    @media print {
      @page { size: A4 portrait; margin: 8mm; }
      body { background: #fff !important; color: #111827 !important; }
      html, body { height: auto !important; overflow: visible !important; }
      /* 列印時只保留出缺席統計：其餘內容直接移出版面（不佔頁面），並解除彈窗的固定定位與捲動裁切，才能完整分頁。 */
      body:has(.attendance-print-overlay) > *:not(.attendance-print-overlay) { display: none !important; }
      .attendance-print-overlay { position: static !important; inset: auto !important; display: block !important; height: auto !important; max-height: none !important; overflow: visible !important; padding: 0 !important; background: #fff !important; backdrop-filter: none !important; }
      .attendance-print-panel { position: static !important; display: block !important; max-width: none !important; width: 100% !important; height: auto !important; max-height: none !important; overflow: visible !important; padding: 0 !important; margin: 0 !important; border: 0 !important; box-shadow: none !important; background: #fff !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
      .attendance-print-panel > *:not(#attendance-stats-print) { display: none !important; }
      #attendance-stats-print { position: static !important; display: block !important; width: 100% !important; height: auto !important; overflow: visible !important; color: #111827 !important; background: #fff !important; }
      #attendance-stats-print > * + * { margin-top: 10px !important; }
      #attendance-stats-print thead th { position: static !important; background: #f1f5f9 !important; }
      #attendance-stats-print tbody tr, #attendance-stats-print tbody tr:nth-child(even) { background: #fff !important; break-inside: avoid; page-break-inside: avoid; }
      #attendance-stats-print thead { display: table-header-group; }
      #attendance-stats-print table { font-size: 7.5pt !important; line-height: 1.15 !important; }
      #attendance-stats-print th, #attendance-stats-print td { padding: 1px 3px !important; line-height: 1.15 !important; }
      #attendance-stats-print .att-group-row td { padding: 2px 4px !important; font-size: 7.5pt !important; }
      #attendance-stats-print > * + * { margin-top: 4px !important; }
      #attendance-stats-print .att-group-row td { background: #e0e7ff !important; break-after: avoid; }
      #attendance-stats-print .no-print-hint { display: none !important; }
      #attendance-stats-print .att-low { background: #fecaca !important; border: 1px solid #dc2626 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; break-inside: avoid; }
      #attendance-stats-print .att-low * { color: #7f1d1d !important; }
      #attendance-stats-print .att-low-chip { background: #fff !important; border: 1px solid #dc2626 !important; }
