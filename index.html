<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>明道中學直播團隊系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK Module Import -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, deleteDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    window.FirebaseSDK = {
      initializeApp,
      getAuth,
      signInWithCustomToken,
      signInAnonymously,
      onAuthStateChanged,
      getFirestore,
      collection,
      doc,
      setDoc,
      deleteDoc,
      getDoc,
      onSnapshot
    };

    window.dispatchEvent(new Event('firebase-sdk-ready'));
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-stream-team-portal';
    
    // 讀取本地儲存的 Firebase 設定或預設
    const getSavedFirebaseConfig = () => {
      try {
        const saved = localStorage.getItem('md_live_firebase_config');
        if (saved) return JSON.parse(saved);
      } catch(e){}
      return typeof __firebase_config !== 'undefined' 
        ? (typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config) 
        : { apiKey: "", authDomain: "", projectId: "" };
    };

    // 本地持久化 Helper
    const loadLocalData = (key, fallback) => {
      try {
        const item = localStorage.getItem(`md_live_${key}`);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    };

    const saveLocalData = (key, data) => {
      try {
        localStorage.setItem(`md_live_${key}`, JSON.stringify(data));
      } catch (e) {}
    };

    const INITIAL_MEMBERS = [
      { id: 'm1', name: '蔡孜鵬', password: '31V714', role: 'admin', title: '總召', dept: 'admin', avatar: '' },
      { id: 'm2', name: '洪睿頤', password: '31S441', role: 'leader', title: '導播組長', dept: 'director', avatar: '' },
      { id: 'm3', name: '蕭宥華', password: '31S442', role: 'leader', title: 'CAM2 組長', dept: 'cam2', avatar: '' },
      { id: 'm4', name: '陳盈融', password: '31S276', role: 'leader', title: '音控組長', dept: 'audio', avatar: '' },
      { id: 'm10', name: '柯昱丞', password: '31S136', role: 'member', title: '導播組員', dept: 'director', avatar: '' },
      { id: 'm5', name: '楊奕璿', password: '41S285', role: 'member', title: '導播組員', dept: 'director', avatar: '' },
      { id: 'm6', name: '陳姿聿', password: '31V621', role: 'member', title: '音控組員', dept: 'audio', avatar: '' },
      { id: 'm7', name: '胡永璋', password: '41S465', role: 'member', title: '音控組員', dept: 'audio', avatar: '' },
      { id: 'm9', name: '黃芃瑀', password: '31V583', role: 'member', title: 'CAM1 攝影', dept: 'cam1', avatar: '' },
      { id: 'm8', name: '戴士捷', password: '41V105', role: 'member', title: 'CAM2 攝影', dept: 'cam2', avatar: '' }
    ];

    const DUTY_ROLES = [
      { key: 'director', label: '導播', deptKey: 'director', icon: 'tv' },
      { key: 'audio', label: '音控', deptKey: 'audio', icon: 'sliders' },
      { key: 'cam1', label: 'CAM1 攝影', deptKey: 'cam1', icon: 'camera' },
      { key: 'cam2', label: 'CAM2 攝影', deptKey: 'cam2', icon: 'video' },
      { key: 'slides', label: '簡報/字卡', deptKey: 'slides', icon: 'file-text' }
    ];

    const INITIAL_SCHEDULES = []; // 預設無任何班表

    const INITIAL_SOP = {
      director: { title: '導播 SOP', items: ['07:20 前抵達導播室，開啟總電源與 OBS', '測試畫面切換與錄影品質'] },
      audio: { title: '音控 SOP', items: ['07:25 開啟混音器與無線麥克風', '檢查麥克風電池電量與音量衰減'] },
      cam1: { title: 'CAM1 SOP', items: ['設置於中央主機位，調整水平儀與焦距', '確認特寫畫面順暢'] },
      cam2: { title: 'CAM2 SOP', items: ['設置側邊視角，負責台下反應與頒獎特寫'] },
      slides: { title: '簡報 SOP', items: ['確認當日朝會 PPT、影片檔與字幕卡', '與導播確認雙螢幕輸出訊號'] }
    };

    function App() {
      const [sdkReady, setSdkReady] = useState(!!window.FirebaseSDK);
      const [db, setDb] = useState(null);
      const [authUser, setAuthUser] = useState(null);
      const [fbConfig, setFbConfig] = useState(getSavedFirebaseConfig);

      const [currentUser, setCurrentUser] = useState(null);
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [message, setMessage] = useState('');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [isSuggestionModalOpen, setIsSuggestionModalOpen] = useState(false);
      const [isEditingSchedule, setIsEditingSchedule] = useState(false);
      const [editingScheduleData, setEditingScheduleData] = useState(null);
      const [showAllForRole, setShowAllForRole] = useState({});
      const [editingSopKey, setEditingSopKey] = useState(null);
      const [editingSopContent, setEditingSopContent] = useState('');
      const [isSwapModalOpen, setIsSwapModalOpen] = useState(false);
      const [isRepairModalOpen, setIsRepairModalOpen] = useState(false);
      const [isMemberModalOpen, setIsMemberModalOpen] = useState(false);
      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
      const [editingMemberData, setEditingMemberData] = useState(null);
      const [isPersonalSettings, setIsPersonalSettings] = useState(false);
      const [avatarBase64, setAvatarBase64] = useState('');
      const [memberSearchQuery, setMemberSearchQuery] = useState('');
      const [deleteConfirm, setDeleteConfirm] = useState(null);

      const showToast = (msg) => {
        setMessage(msg);
        setTimeout(() => {
          setMessage('');
        }, 3000);
      };

      // 初始化資料
      const [members, setMembers] = useState(() => loadLocalData('members', INITIAL_MEMBERS));
      const [schedules, setSchedules] = useState(() => loadLocalData('schedules', INITIAL_SCHEDULES));
      const [repairs, setRepairs] = useState(() => loadLocalData('repairs', []));
      const [swaps, setSwaps] = useState(() => loadLocalData('swaps', []));
      const [announcement, setAnnouncement] = useState(() => loadLocalData('announcement', '📢 請全體成員於朝會前 10 分鐘完成所有設備校正！'));
      const [leaderSuggestions, setLeaderSuggestions] = useState(() => loadLocalData('suggestions', [])); 
      const [sopData, setSopData] = useState(() => loadLocalData('sop', INITIAL_SOP));

      const broadcastRef = useRef(null);

      // 1. 監聽 Firebase SDK 異步加載
      useEffect(() => {
        if (window.FirebaseSDK) {
          setSdkReady(true);
          return;
        }
        const handleReady = () => setSdkReady(true);
        window.addEventListener('firebase-sdk-ready', handleReady);
        const timer = setInterval(() => {
          if (window.FirebaseSDK) {
            setSdkReady(true);
            clearInterval(timer);
          }
        }, 100);
        return () => {
          window.removeEventListener('firebase-sdk-ready', handleReady);
          clearInterval(timer);
        };
      }, []);

      // 2. 本地跨頁籤即時廣播頻道 (BroadcastChannel)
      useEffect(() => {
        try {
          if ('BroadcastChannel' in window) {
            const channel = new BroadcastChannel('md_live_sync_channel');
            broadcastRef.current = channel;
            channel.onmessage = (event) => {
              const { type, payload } = event.data || {};
              if (type === 'SCHEDULES_UPDATED') { setSchedules(payload); saveLocalData('schedules', payload); }
              if (type === 'MEMBERS_UPDATED') { setMembers(payload); saveLocalData('members', payload); }
              if (type === 'ANNOUNCEMENT_UPDATED') { setAnnouncement(payload); saveLocalData('announcement', payload); }
              if (type === 'SUGGESTIONS_UPDATED') { setLeaderSuggestions(payload); saveLocalData('suggestions', payload); }
              if (type === 'REPAIRS_UPDATED') { setRepairs(payload); saveLocalData('repairs', payload); }
              if (type === 'SWAPS_UPDATED') { setSwaps(payload); saveLocalData('swaps', payload); }
              if (type === 'SOP_UPDATED') { setSopData(payload); saveLocalData('sop', payload); }
            };
            return () => channel.close();
          }
        } catch (e) {
          console.warn("BroadcastChannel not supported:", e);
        }
      }, []);

      // 廣播與本地存檔統一觸發器
      const notifyAndSave = (key, type, payload) => {
        saveLocalData(key, payload);
        if (broadcastRef.current) {
          try {
            broadcastRef.current.postMessage({ type, payload });
          } catch (e) {
            console.warn("Broadcast failed:", e);
          }
        }
      };

      // 3. Firebase Firestore 雲端同步初始化
      useEffect(() => {
        if (!sdkReady || !window.FirebaseSDK) return;
        const { initializeApp, getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, getFirestore } = window.FirebaseSDK;
        try {
          if (!fbConfig || !fbConfig.apiKey || fbConfig.apiKey === "demo") {
            console.warn("未設定有效 Firebase 金鑰，系統運行於單機/跨頁籤即時同步模式。");
            setDb(null);
            return;
          }

          const app = initializeApp(fbConfig);
          const auth = getAuth(app);
          const firestore = getFirestore(app);

          const initAuth = async () => {
            try {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
              setDb(firestore);
            } catch (authErr) {
              console.warn("Firebase Auth 認證失敗，切換至本機模式：", authErr);
            }
          };
          initAuth();
          const unsubscribe = onAuthStateChanged(auth, (usr) => setAuthUser(usr));
          return () => unsubscribe();
        } catch (err) {
          console.warn("Firebase 初始化失敗：", err);
        }
      }, [sdkReady, fbConfig]);

      // 4. Firestore 訂閱與監聽
      useEffect(() => {
        if (!db || !authUser) return;
        const { collection, onSnapshot, doc, setDoc } = window.FirebaseSDK;

        const schedulesRef = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
        const annRef = collection(db, 'artifacts', appId, 'public', 'data', 'announcements');
        const suggestionsRef = collection(db, 'artifacts', appId, 'public', 'data', 'suggestions');
        const repairsRef = collection(db, 'artifacts', appId, 'public', 'data', 'repairs');
        const swapsRef = collection(db, 'artifacts', appId, 'public', 'data', 'swaps');
        const membersRef = collection(db, 'artifacts', appId, 'public', 'data', 'members');
        const sopRef = collection(db, 'artifacts', appId, 'public', 'data', 'sops');

        const unsubs = [];

        try {
          unsubs.push(onSnapshot(schedulesRef, (snapshot) => {
            const list = snapshot.docs.map(d => d.data());
            list.sort((a, b) => new Date(a.date) - new Date(b.date));
            setSchedules(list);
            notifyAndSave('schedules', 'SCHEDULES_UPDATED', list);
          }, (err) => console.warn("Schedules listener error:", err)));

          unsubs.push(onSnapshot(membersRef, (snapshot) => {
            if (snapshot.empty) {
              INITIAL_MEMBERS.forEach(m => setDoc(doc(membersRef, m.id), m));
            } else {
              const list = snapshot.docs.map(d => d.data());
              setMembers(list);
              setCurrentUser(prev => prev ? list.find(m => m.id === prev.id) || prev : null);
              notifyAndSave('members', 'MEMBERS_UPDATED', list);
            }
          }, (err) => console.warn("Members listener error:", err)));

          unsubs.push(onSnapshot(doc(annRef, 'main'), (snap) => {
            if (snap.exists()) {
              const txt = snap.data().text || '';
              setAnnouncement(txt);
              notifyAndSave('announcement', 'ANNOUNCEMENT_UPDATED', txt);
            }
          }, (err) => console.warn("Announcement listener error:", err)));

          unsubs.push(onSnapshot(doc(sopRef, 'main'), (snap) => {
            if (snap.exists()) {
              const content = snap.data().content || INITIAL_SOP;
              setSopData(content);
              notifyAndSave('sop', 'SOP_UPDATED', content);
            }
          }, (err) => console.warn("SOP listener error:", err)));

          unsubs.push(onSnapshot(suggestionsRef, (snapshot) => {
            const list = snapshot.docs.map(d => d.data());
            list.sort((a, b) => b.timestamp - a.timestamp);
            setLeaderSuggestions(list);
            notifyAndSave('suggestions', 'SUGGESTIONS_UPDATED', list);
          }, (err) => console.warn("Suggestions listener error:", err)));

          unsubs.push(onSnapshot(repairsRef, (snapshot) => {
            const list = snapshot.docs.map(d => d.data());
            setRepairs(list);
            notifyAndSave('repairs', 'REPAIRS_UPDATED', list);
          }, (err) => console.warn("Repairs listener error:", err)));

          unsubs.push(onSnapshot(swapsRef, (snapshot) => {
            const list = snapshot.docs.map(d => d.data());
            setSwaps(list);
            notifyAndSave('swaps', 'SWAPS_UPDATED', list);
          }, (err) => console.warn("Swaps listener error:", err)));
        } catch (e) {
          console.warn("Snapshot register error:", e);
        }

        return () => unsubs.forEach(unsub => unsub());
      }, [db, authUser]);

      useEffect(() => {
        if (window.lucide) {
          try { window.lucide.createIcons(); } catch(err) {}
        }
      });

      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const foundMember = members.find(m => m.password.toLowerCase() === loginPassword.trim().toLowerCase());
        if (foundMember) {
          setCurrentUser(foundMember);
          setLoginPassword('');
          showToast(`歡迎回來，${foundMember.name}！`);
        } else {
          setLoginError('密碼錯誤，請重新確認');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        showToast('已安全登出');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setAvatarBase64(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSaveFirebaseConfig = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const newCfg = {
          apiKey: formData.get('apiKey').trim(),
          authDomain: formData.get('authDomain').trim(),
          projectId: formData.get('projectId').trim(),
          storageBucket: formData.get('storageBucket').trim(),
          messagingSenderId: formData.get('messagingSenderId').trim(),
          appId: formData.get('appId').trim()
        };
        localStorage.setItem('md_live_firebase_config', JSON.stringify(newCfg));
        setFbConfig(newCfg);
        setIsConfigModalOpen(false);
        showToast('Firebase 設定已儲存，正在重新連線...');
      };

      const handlePostSuggestion = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const sugObj = {
          id: `sug-${Date.now()}`,
          authorId: currentUser.id,
          authorName: currentUser.name,
          authorTitle: currentUser.title,
          content: formData.get('content'),
          timestamp: Date.now()
        };

        const updated = [sugObj, ...leaderSuggestions];
        setLeaderSuggestions(updated);
        notifyAndSave('suggestions', 'SUGGESTIONS_UPDATED', updated);

        if (db) {
          try {
            const { doc, setDoc } = window.FirebaseSDK;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'suggestions', sugObj.id), sugObj);
          } catch(err){}
        }
        showToast('組長公告/建議已發布！');
        setIsSuggestionModalOpen(false);
      };

      const triggerDeleteSuggestion = (sugId) => {
        setDeleteConfirm({
          title: '刪除公告/建議',
          message: '確定要刪除這則公告/建議嗎？此操作無法復原。',
          onConfirm: async () => {
            const updated = leaderSuggestions.filter(s => s.id !== sugId);
            setLeaderSuggestions(updated);
            notifyAndSave('suggestions', 'SUGGESTIONS_UPDATED', updated);

            if (db) {
              try {
                const { doc, deleteDoc } = window.FirebaseSDK;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'suggestions', sugId));
              } catch(err){}
            }
            showToast('已刪除公告/建議');
            setDeleteConfirm(null);
          }
        });
      };

      const handleSaveSop = async (roleKey) => {
        const lines = editingSopContent.split('\n').filter(l => l.trim() !== '');
        const updatedSop = {
          ...sopData,
          [roleKey]: {
            ...sopData[roleKey],
            items: lines
          }
        };

        setSopData(updatedSop);
        notifyAndSave('sop', 'SOP_UPDATED', updatedSop);

        if (db) {
          try {
            const { doc, setDoc } = window.FirebaseSDK;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sops', 'main'), { content: updatedSop });
          } catch(err){}
        }
        showToast('SOP 已成功更新！');
        setEditingSopKey(null);
      };

      const handleOpenScheduleModal = (sch = null) => {
        if (sch) setEditingScheduleData(JSON.parse(JSON.stringify(sch)));
        else {
          setEditingScheduleData({
            id: `sch-${Date.now()}`,
            date: new Date().toISOString().split('T')[0],
            title: '朝會直播排班',
            time: '07:30 - 08:20',
            assignments: { director: [], audio: [], cam1: [], cam2: [], slides: [] }
          });
        }
        setShowAllForRole({});
        setIsEditingSchedule(true);
      };

      const handleToggleMemberAssignment = (roleKey, memberId) => {
        if (!editingScheduleData) return;
        setEditingScheduleData(prev => {
          if (!prev) return null;
          const assignments = prev.assignments || {};
          const currentList = Array.isArray(assignments[roleKey]) ? assignments[roleKey] : [];
          const isAssigned = currentList.includes(memberId);
          const newList = isAssigned ? currentList.filter(id => id !== memberId) : [...currentList, memberId];
          return { ...prev, assignments: { ...assignments, [roleKey]: newList } };
        });
      };

      const handleSaveScheduleSubmit = async (e) => {
        e.preventDefault();
        if (!editingScheduleData) return;

        let updatedList;
        const exists = schedules.some(s => s.id === editingScheduleData.id);
        if (exists) {
          updatedList = schedules.map(s => s.id === editingScheduleData.id ? editingScheduleData : s);
        } else {
          updatedList = [...schedules, editingScheduleData];
        }
        updatedList.sort((a, b) => new Date(a.date) - new Date(b.date));

        setSchedules(updatedList);
        notifyAndSave('schedules', 'SCHEDULES_UPDATED', updatedList);

        if (db) {
          try {
            const { doc, setDoc } = window.FirebaseSDK;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', editingScheduleData.id), editingScheduleData);
          } catch(err){}
        }
        showToast('班表已儲存並同步！');
        setIsEditingSchedule(false);
        setEditingScheduleData(null);
      };

      const triggerDeleteSchedule = (sch) => {
        setDeleteConfirm({
          title: '刪除班表確認',
          message: `確定要刪除班表【${sch.date} ${sch.title}】嗎？刪除後無法恢復。`,
          onConfirm: async () => {
            const updatedList = schedules.filter(s => s.id !== sch.id);
            setSchedules(updatedList);
            notifyAndSave('schedules', 'SCHEDULES_UPDATED', updatedList);

            if (db) {
              try {
                const { doc, deleteDoc } = window.FirebaseSDK;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', sch.id));
              } catch(err){}
            }
            showToast(`已刪除班表：${sch.title}`);
            setIsEditingSchedule(false);
            setEditingScheduleData(null);
            setDeleteConfirm(null);
          }
        });
      };

      const handleUpdateAnnouncement = async () => {
        const newAnn = prompt('編輯官方公告：', announcement);
        if (newAnn) {
          setAnnouncement(newAnn);
          notifyAndSave('announcement', 'ANNOUNCEMENT_UPDATED', newAnn);

          if (db) {
            try {
              const { doc, setDoc } = window.FirebaseSDK;
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'announcements', 'main'), { text: newAnn });
            } catch(err){}
          }
          showToast('公告已更新廣播！');
        }
      };

      const handleRequestSwap = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const newSwap = {
          id: `sw-${Date.now()}`,
          requester: currentUser.name,
          targetDate: formData.get('targetDate'),
          roleLabel: formData.get('roleLabel'),
          reason: formData.get('reason'),
          status: 'pending'
        };

        const updated = [newSwap, ...swaps];
        setSwaps(updated);
        notifyAndSave('swaps', 'SWAPS_UPDATED', updated);

        if (db) {
          try {
            const { doc, setDoc } = window.FirebaseSDK;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'swaps', newSwap.id), newSwap);
          } catch(err){}
        }
        showToast('請假/換班申請已送出！');
        setIsSwapModalOpen(false);
      };

                  </div>
                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                    <button type="button" onClick={() => setIsSuggestionModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" className="px-4 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl">發布</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 3. Firebase 雲端設定 Modal */}
          {isConfigModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-5 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                  <h3 className="font-bold text-white text-sm flex items-center space-x-2">
                    <i data-lucide="cloud-cog" className="w-5 h-5 text-indigo-400"></i>
                    <span>Firebase 雲端同步金鑰設定</span>
                  </h3>
                  <button onClick={() => setIsConfigModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <p className="text-xs text-slate-300">
                  預設採用<span className="text-indigo-400 font-bold">「同瀏覽器多頁籤/視窗即時廣播與本地存檔」</span>。若需跨裝置跨網路真雲端同步，請貼上您的 Firebase Firestore 金鑰：
                </p>
                <form onSubmit={handleSaveFirebaseConfig} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">API Key</label>
                    <input name="apiKey" defaultValue={fbConfig?.apiKey || ''} placeholder="AIzaSy..." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white font-mono" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Auth Domain</label>
                    <input name="authDomain" defaultValue={fbConfig?.authDomain || ''} placeholder="your-app.firebaseapp.com" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white font-mono" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Project ID</label>
                    <input name="projectId" defaultValue={fbConfig?.projectId || ''} placeholder="your-project-id" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white font-mono" />
                  </div>
                  <div className="flex justify-between items-center pt-2 border-t border-slate-700">
                    <button 
                      type="button" 
                      onClick={() => {
                        localStorage.removeItem('md_live_firebase_config');
                        setFbConfig({ apiKey: "", authDomain: "", projectId: "" });
                        setIsConfigModalOpen(false);
                        showToast('已清空 Firebase 設定，恢復本機模式');
                      }}
                      className="px-3 py-1.5 bg-rose-950/40 border border-rose-500/30 text-rose-300 rounded-xl text-xs"
                    >
                      清空金鑰
                    </button>
                    <div className="flex space-x-2">
                      <button type="button" onClick={() => setIsConfigModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                      <button type="submit" className="px-4 py-1.5 bg-indigo-600 text-white font-bold rounded-xl">儲存並連線</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 4. 請假/換班 Modal */}
          {isSwapModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                  <h3 className="font-bold text-white text-sm">請假 / 換班申請</h3>
                  <button onClick={() => setIsSwapModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleRequestSwap} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">目標日期 (選擇您的排班)</label>
                    <select name="targetDate" required className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
                      {userScheduledDates.length > 0 ? (
                        userScheduledDates.map((item, idx) => (
                          <option key={idx} value={item.date}>{item.date} - {item.title}</option>
                        ))
                      ) : (
                        <option value="" disabled>目前您近期無排程班表</option>
                      )}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">工作崗位</label>
                    <select name="roleLabel" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                      {DUTY_ROLES.map(r => <option key={r.key} value={r.label}>{r.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">請假理由</label>
                    <textarea name="reason" rows="2" required placeholder="說明事由..." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></textarea>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                    <button type="button" onClick={() => setIsSwapModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" className="px-3 py-1.5 bg-indigo-600 text-white font-bold rounded-xl">送出申請</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 5. 設備報修 Modal */}
          {isRepairModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                  <h3 className="font-bold text-white text-sm">設備報修</h3>
                  <button onClick={() => setIsRepairModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleReportRepair} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">設備名稱</label>
                    <input name="item" required placeholder="例：Cam1 腳架" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">狀況描述</label>
                    <textarea name="issue" rows="2" required placeholder="說明問題..." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white"></textarea>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                    <button type="button" onClick={() => setIsRepairModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" className="px-3 py-1.5 bg-rose-600 text-white font-bold rounded-xl">提交</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 6. 新增/編輯成員 Modal */}
          {isMemberModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                  <h3 className="font-bold text-white text-sm">
                    {isPersonalSettings ? '個人設定 (修改姓名/頭貼/密碼)' : (editingMemberData ? '編輯成員資料' : '新增成員')}
                  </h3>
                  <button onClick={() => setIsMemberModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleSaveMemberSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">姓名</label>
                    <input name="name" defaultValue={editingMemberData?.name || (isPersonalSettings ? currentUser.name : '')} required placeholder="例：許小華" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" />
                  </div>

                  {!isPersonalSettings && (
                    <>
                      <div>
                        <label className="block text-slate-400 mb-1">所屬組別</label>
                        <select name="dept" defaultValue={editingMemberData?.dept || 'director'} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                          <option value="admin">總召辦公室</option>
                          <option value="director">導播組</option>
                          <option value="audio">音控組</option>
                          <option value="cam1">CAM1 攝影組</option>
                          <option value="cam2">CAM2 攝影組</option>
                          <option value="slides">簡報組</option>
                          <option value="intern">實習生 / 支援</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">頭銜 / 職務</label>
                        <input name="title" defaultValue={editingMemberData?.title || '直播實習生'} required placeholder="例：導播組長、直播實習生" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white" />
                      </div>
                    </>
                  )}

                  <div>
                    <label className="block text-slate-400 mb-1">上傳大頭貼照片</label>
                    <input type="file" accept="image/*" onChange={handleImageUpload} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-1.5 text-slate-300 text-xs file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500" />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">登入密碼</label>
                    <input name="password" defaultValue={editingMemberData?.password || (isPersonalSettings ? currentUser.password : '')} required placeholder="例：31S999" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white font-mono" />
                  </div>

                  {!isPersonalSettings && currentUser.role === 'admin' && (
                    <div>
                      <label className="block text-slate-400 mb-1">系統權限層級</label>
                      <select name="role" defaultValue={editingMemberData?.role || 'member'} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
                        <option value="member">組員 / 實習生</option>
                        <option value="leader">組長</option>
                        <option value="admin">老師 / 總召</option>
                      </select>
                    </div>
                  )}

                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                    <button type="button" onClick={() => setIsMemberModalOpen(false)} className="px-3 py-1.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                    <button type="submit" className="px-3 py-1.5 bg-indigo-600 text-white rounded-xl font-bold">確認儲存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 7. 二次確認 Modal (通用刪除對話框) */}
          {deleteConfirm && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4">
                <div className="flex items-center space-x-3 text-rose-400">
                  <div className="bg-rose-500/20 p-2 rounded-xl border border-rose-500/30">
                    <i data-lucide="alert-triangle" className="w-5 h-5"></i>
                  </div>
                  <h3 className="font-bold text-white text-sm">{deleteConfirm.title}</h3>
                </div>
                <p className="text-xs text-slate-300 leading-relaxed">{deleteConfirm.message}</p>
                <div className="flex justify-end space-x-2 pt-2 border-t border-slate-700">
                  <button
                    type="button"
                    onClick={() => setDeleteConfirm(null)}
                    className="px-3.5 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl text-xs font-medium transition"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    onClick={deleteConfirm.onConfirm}
                    className="px-3.5 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs transition shadow-lg"
                  >
                    確認刪除
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
